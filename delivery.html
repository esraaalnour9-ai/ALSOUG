// ===== التحميل =====
var ORD_SEL="orders?select=id,code,store_id,customer_name,customer_phone,customer_address,pay_method,total,status,created_at,delivery_type,delivery_status,delivery_fee,delivery_distance_km,delivery_weight_kg,delivery_zone,delivery_note,driver_id,delivered_at,order_items(name,unit,qty,price)";
function boot(){
  $("app").innerHTML='<div class="empty">⏳ جاري التحميل...</div>';
  Promise.all([api("GET","admins?select=user_id"),api("GET","delivery_staff?select=*&order=created_at"),api("GET","stores?select=id,name,whatsapp&order=name&limit=1000"),api("GET","delivery_zones?select=*&order=sort_order,name&limit=200").catch(function(){return[]}),api("GET","delivery_weight_tiers?select=*&order=over_kg").catch(function(){return[]}),api("GET","app_settings?select=key,value").catch(function(){return[]})]).then(function(r){
    ZONES=r[3]||[];TIERS=r[4]||[];(r[5]||[]).forEach(function(x){if(x.key==="delivery_paused")DPAUSE=x.value==="1";if(x.key==="delivery_paused_msg")DPMSG=x.value});
    ME.master=!!(r[0]&&r[0].length);
    STAFF=r[1]||[];STORES=r[2]||[];
    var mine=STAFF.filter(function(s){return s.user_id===SESS.uid})[0];
    ME.uid=SESS.uid;
    ME.role=mine&&mine.active?mine.role:"";
    if(!ME.master&&!ME.role){
      $("app").innerHTML='<div class="card"><div class="err">هذا الحساب ليس ضمن فريق التوصيل أو أُوقف. تواصل مع الإدارة.</div><button class="btn btn-line" data-act="logout">تسجيل الخروج</button></div>';
      $("outBtn").hidden=false;return;
    }
    $("muteBtn").hidden=false;$("outBtn").hidden=false;$("muteBtn").textContent=muted?"🔕":"🔔";
    $("hTitle").textContent=isDisp()?"لوحة التوصيل":"طلباتي — السائق";
    return loadOrders().then(function(){lastSig=sig();seenNew=countNew();render();startPolling()});
  }).catch(fail);
}
function loadOrders(){
  var q=isDisp()
    ?ORD_SEL+"&delivery_type=eq.delivery&delivery_status=neq.none&order=created_at.desc&limit=300"
    :ORD_SEL+"&delivery_status=in.(assigned,picked,delivered)&order=created_at.desc&limit=100";
  return api("GET",q).then(function(x){ORDERS=x||[]});
}
function countNew(){return ORDERS.filter(function(o){return isDisp()?o.delivery_status==="requested":o.delivery_status==="assigned"}).length}
function sig(){return ORDERS.map(function(o){return o.id+o.delivery_status+o.driver_id+o.delivery_fee}).join("|")}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(function(){
    if(document.hidden||!SESS)return;
    loadOrders().then(function(){
      var n=countNew();if(seenNew>=0&&n>seenNew)beep();seenNew=n;
      var s=sig();if(s===lastSig)return;lastSig=s;
      var ae=document.activeElement;
      if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return; // لا نقاطع من يكتب
      render();
    }).catch(function(){});
  },20000);
}

// ===== العرض =====
function render(){
  $("app").innerHTML=isDisp()?dispHtml():driverHtml();
}
function orderBase(o,extra){
  var ph=waNum(o.customer_phone),sp=waNum(storePhone(o.store_id));
  return '<div class="item"><div class="row"><div class="iname">#'+esc(o.code)+' — '+esc(storeName(o.store_id))+'</div><span class="badge '+(ST_CLS[o.delivery_status]||"")+'">'+esc((!isDisp()&&o.delivery_status==="assigned")?"جاهز: استلمه من المتجر":(ST_LBL[o.delivery_status]||o.delivery_status))+'</span></div>'+
    '<div class="imeta">👤 '+esc(o.customer_name)+' · 📞 <a class="lnk ltr" href="tel:'+esc(ph)+'">'+esc(o.customer_phone)+'</a> · <a class="lnk" target="_blank" rel="noopener" href="https://wa.me/'+esc(ph)+'">واتساب</a></div>'+
    '<div class="imeta">'+(o.delivery_zone?'🗺️ الحي: <b>'+esc(o.delivery_zone)+'</b> · ':'')+'📍 '+esc(o.customer_address)+'</div>'+
    '<div class="imeta">🏪 المتجر: '+(sp?'<a class="lnk" target="_blank" rel="noopener" href="https://wa.me/'+esc(sp)+'">واتساب المتجر</a>':'-')+' · 💳 '+esc(o.pay_method||"-")+' · 🕒 '+esc(dt(o.created_at))+'</div>'+
    (o.driver_id?'<div class="imeta">🛵 السائق: <b>'+esc(staffName(o.driver_id)||"—")+'</b></div>':'')+
    (o.delivery_note?'<div class="imeta">📝 '+esc(o.delivery_note)+'</div>':'')+
    (o.order_items||[]).map(function(i){return '<div class="oitem">• '+esc(i.name)+' ('+esc(i.unit)+') × '+i.qty+'</div>'}).join("")+
    '<div class="row" style="margin-top:6px"><b>إجمالي الطلب: '+fmt(o.total)+' جنيه</b><span class="muted">رسم التوصيل: '+(+o.delivery_fee>0?fmt(o.delivery_fee)+' جنيه':'لم يُحدَّد')+
    (o.delivery_weight_kg!=null?' · '+fmtKg(o.delivery_weight_kg):'')+'</span></div>'+
    (extra||'')+'</div>';
}
function dispHtml(){
  var cnt={new:0,active:0,done:0};
  ORDERS.forEach(function(o){var s=o.delivery_status;if(s==="requested")cnt.new++;else if(s==="assigned"||s==="picked")cnt.active++;else cnt.done++});
  var h='<div class="tabs2">'+
    [["orders","🧾 الطلبات"],["staff","👥 الفريق"],["prices","💲 الأسعار"],["report","📊 التقارير"]].filter(function(t){return t[0]!=="prices"||isDisp()}).map(function(t){return '<button class="chip '+(TAB===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
  if(TAB==="staff")return h+staffHtml();
  if(TAB==="prices"&&isDisp())return h+pricesHtml();
  if(TAB==="report")return h+reportHtml();
  h+='<div class="tabs2">'+
    [["new","جديدة ("+cnt.new+")"],["active","قيد التنفيذ ("+cnt.active+")"],["done","منتهية ("+cnt.done+")"],["all","الكل"]].map(function(t){return '<button class="chip '+(FILT===t[0]?'on':'')+'" data-filt="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
  var list=ORDERS.filter(function(o){
    var s=o.delivery_status;
    return FILT==="all"||(FILT==="new"&&s==="requested")||(FILT==="active"&&(s==="assigned"||s==="picked"))||(FILT==="done"&&(s==="delivered"||s==="cancelled"));
  });
  h+='<div class="card">';
  if(!list.length)h+='<div class="empty">لا توجد طلبات في هذا القسم.</div>';
  list.forEach(function(o){h+=orderBase(o,dispActions(o))});
  return h+'</div>';
}
function dispActions(o){
  var s=o.delivery_status,id=esc(o.id);
  if(s==="delivered"||s==="cancelled")return '';
  var ds=drivers();
  var form='<div class="dform"><label>السائق</label><select id="dr-'+id+'"><option value="">— اختر سائقًا —</option>'+
    ds.map(function(d){return '<option value="'+esc(d.user_id)+'"'+(o.driver_id===d.user_id?' selected':'')+'>'+esc(d.name)+'</option>'}).join("")+'</select>'+
    '<div class="grid3"><div><label>الوزن</label><input id="kg-'+id+'" class="numonly" data-wt="'+id+'" type="text" inputmode="decimal" placeholder="مثال: 6" value="'+(o.delivery_weight_kg!=null?(+o.delivery_weight_kg<1?Math.round(o.delivery_weight_kg*1000):o.delivery_weight_kg):"")+'"></div>'+
    '<div><label>الوحدة</label><select id="un-'+id+'" data-wt="'+id+'"><option value="kg"'+(o.delivery_weight_kg!=null&&+o.delivery_weight_kg<1?'':' selected')+'>كجم</option><option value="g"'+(o.delivery_weight_kg!=null&&+o.delivery_weight_kg<1?' selected':'')+'>جرام</option></select></div>'+
    '<div><label>الرسم (جنيه)</label><input id="fee-'+id+'" class="numonly" type="text" inputmode="decimal" value="'+(+o.delivery_fee>0?o.delivery_fee:"")+'"></div></div>'+
    '<div class="hint" id="fh-'+id+'">'+(o.delivery_zone&&zoneByName(o.delivery_zone)?'رسم حي '+esc(o.delivery_zone)+': '+fmt(zoneByName(o.delivery_zone).fee)+' جنيه. اكتبي الوزن ليُحسب الرسم تلقائيًا، ولك تعديله.':'اكتبي الرسم يدويًا.')+'</div>'+
    '<input id="nt-'+id+'" maxlength="300" placeholder="ملاحظة (اختياري)" value="'+esc(o.delivery_note||"")+'"></div>';
  var b='<div class="acts"><button class="btn btn-sm" data-act="assign" data-id="'+id+'">'+(s==="requested"?'✓ تعيين السائق وتأكيد':'حفظ التعديل')+'</button>';
  if(s==="assigned")b+='<button class="btn btn-sm btn-line" data-act="setst" data-id="'+id+'" data-v="picked">السائق استلم الطلب</button>';
  if(s==="picked")b+='<button class="btn btn-sm btn-green" data-act="setst" data-id="'+id+'" data-v="delivered">✓ تم التوصيل</button>';
  b+='<button class="btn btn-sm btn-red" data-act="setst" data-id="'+id+'" data-v="cancelled">إلغاء التوصيل</button></div>';
  return form+b;
}
function driverHtml(){
  var act=ORDERS.filter(function(o){return o.delivery_status==="assigned"||o.delivery_status==="picked"});
  var done=ORDERS.filter(function(o){return o.delivery_status==="delivered"&&o.delivered_at&&new Date(o.delivered_at).toDateString()===new Date().toDateString()});
  var fees=done.reduce(function(a,o){return a+(+o.delivery_fee||0)},0);
  var h='<div class="card"><h2>🛵 طلباتي الحالية ('+act.length+')</h2>';
  if(!act.length)h+='<div class="empty">لا توجد طلبات معيّنة لك الآن. ستظهر هنا فور تعيينها.</div>';
  act.forEach(function(o){
    var id=esc(o.id),btn=o.delivery_status==="assigned"
      ?'<div class="acts"><button class="btn" style="flex:1" data-act="setst" data-id="'+id+'" data-v="picked">📦 استلمت الطلب من المتجر</button></div>'
      :'<div class="acts"><button class="btn btn-green" style="flex:1" data-act="setst" data-id="'+id+'" data-v="delivered">✅ تم التسليم للزبون</button></div>';
    h+=orderBase(o,btn);
  });
  h+='</div><div class="card"><h2>📅 اليوم</h2><div class="row"><span>طلبات سلّمتها: <b>'+done.length+'</b></span><span>مجموع الرسوم: <b>'+fmt(fees)+'</b> جنيه</span></div></div>';
  return h;
}

  if(!STAFF.length)h+='<div class="empty">لا يوجد موظفون بعد. أضيفي السائقين من الأسفل.</div>';

    h+='<div class="item"><div class="row"><div class="iname">'+(s.role==="supervisor"?'🧭':'🛵')+' '+esc(s.name)+'</div><span class="badge '+(s.active?'green':'red')+'">'+(s.active?'فعّال':'موقوف')+'</span></div>'+
      '<div class="imeta">'+(s.role==="supervisor"?'مشرف':'سائق')+(s.phone?' · 📞 <a class="lnk ltr" href="tel:'+esc(waNum(s.phone))+'">'+esc(s.phone)+'</a>':'')+'</div>'+
      (ME.master?'<div class="acts"><button class="btn btn-sm btn-line" data-act="toggleStaff" data-id="'+esc(s.user_id)+'" data-v="'+(s.active?'0':'1')+'">'+(s.active?'إيقاف':'تفعيل')+'</button>'+
      '<button class="btn btn-sm btn-line" data-act="resetPw" data-login="'+esc(s.phone||"")+'">تغيير كلمة السر</button></div>':'')+'</div>';

      '<label>الدور</label><select id="stRole"><option value="driver">سائق</option><option value="supervisor">مشرف</option></select>'+
      '<button class="btn" data-act="addStaff">إنشاء الحساب</button>'+

  }
  return h;

  if(ME.master)h+='<div class="card"><h2>'+(DPAUSE?'⏸️ التوصيل موقوف مؤقتًا':'✅ التوصيل يعمل')+'</h2>'+
    '<div class="hint" style="margin-bottom:8px">'+(DPAUSE?'عندما يختار الزبون «توصيل الإسراء والمعراج» تظهر له الرسالة أدناه ولا يُرسَل الطلب.':'الزبائن يطلبون توصيل الشركة الآن.')+'</div>'+

      '<div><label>الرسم (جنيه)</label><input id="zf-'+id+'" class="numonly" type="text" inputmode="decimal" value="'+esc(z.fee)+'"></div></div>'+

      '<button class="btn btn-sm btn-red" data-act="zoneDel" data-id="'+id+'">حذف</button></div>'+(z.active?'':'<div class="hint">موقوف: لا يظهر للزبائن.</div>')+'</div>';

  h+='<div class="dform"><label>➕ حيّ جديد</label><input id="znNew" maxlength="60" placeholder="اسم الحي"><input id="zfNew" class="numonly" type="text" inputmode="decimal" placeholder="الرسم بالجنيه"><button class="btn" data-act="zoneAdd">إضافة</button></div></div>';
  h+='<div class="card"><h2>⚖️ زيادة الوزن</h2><div class="hint" style="margin-bottom:8px">إن زاد الوزن عن الحد يُضاف المبلغ إلى رسم الحي. يُطبَّق أعلى حدّ تجاوزه الطلب.</div>';
  TIERS.forEach(function(t){
    var id=esc(t.id);
    h+='<div class="item"><div class="grid3" style="grid-template-columns:1fr 1fr"><div><label>إن زاد الوزن عن (كجم)</label><input id="tk-'+id+'" class="numonly" type="text" inputmode="decimal" value="'+esc(t.over_kg)+'"></div>'+
      '<div><label>يُضاف (جنيه)</label><input id="te-'+id+'" class="numonly" type="text" inputmode="decimal" value="'+esc(t.extra)+'"></div></div>'+
      '<div class="acts"><button class="btn btn-sm" data-act="tierSave" data-id="'+id+'">حفظ</button><button class="btn btn-sm btn-red" data-act="tierDel" data-id="'+id+'">حذف</button></div></div>';

function reloadPrices(){
  return Promise.all([api("GET","delivery_zones?select=*&order=sort_order,name&limit=200"),api("GET","delivery_weight_tiers?select=*&order=over_kg")]).then(function(r){ZONES=r[0]||[];TIERS=r[1]||[];render()});
}
function pErr(e){toast(/duplicate|unique|23505/.test(String((e&&e.message)||"")+(e&&e.code))?"هذا الاسم/الحدّ موجود من قبل.":niceErr(e),true)}
function reportHtml(){
  var del=ORDERS.filter(function(o){return o.delivery_status==="delivered"&&o.delivered_at});
  var now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),
      w0=d0-6*864e5,m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  function agg(from){var c=0,f=0;del.forEach(function(o){if(+new Date(o.delivered_at)>=from){c++;f+=+o.delivery_fee||0}});return{c:c,f:f}}
  var t=agg(d0),w=agg(w0),m=agg(m0);
  function tile(l,a){return '<div class="tile"><small>'+l+'</small><b>'+fmt(a.f)+' جنيه</b><span>'+a.c+' طلب</span></div>'}
  var h='<div class="card"><h2>📊 رسوم التوصيل المحصّلة</h2><div class="tiles">'+tile("اليوم",t)+tile("آخر 7 أيام",w)+tile("هذا الشهر",m)+'</div>'+
    '<div class="hint">تُحسب من الطلبات التي سُجّل أنها وصلت. الأرقام من آخر 300 طلب توصيل.</div></div>';
  var by={};
  del.forEach(function(o){if(+new Date(o.delivered_at)>=m0){var k=o.driver_id||"?";(by[k]=by[k]||{c:0,f:0});by[k].c++;by[k].f+=+o.delivery_fee||0}});
  var ks=Object.keys(by).sort(function(a,b){return by[b].c-by[a].c});
  h+='<div class="card"><h2>🛵 السائقون هذا الشهر</h2>';
  if(!ks.length)h+='<div class="empty">لا توجد توصيلات منتهية هذا الشهر.</div>';
  ks.forEach(function(k){h+='<div class="item"><div class="row"><b>'+esc(staffName(k)||"—")+'</b><span>'+by[k].c+' طلب · '+fmt(by[k].f)+' جنيه</span></div></div>'});
  var bs={};
  del.forEach(function(o){if(+new Date(o.delivered_at)>=m0){bs[o.store_id]=(bs[o.store_id]||0)+1}});
  var sk=Object.keys(bs).sort(function(a,b){return bs[b]-bs[a]});
  h+='</div><div class="card"><h2>🏬 المتاجر هذا الشهر</h2>';
  if(!sk.length)h+='<div class="empty">لا توجد بيانات بعد.</div>';
  sk.forEach(function(k){h+='<div class="item"><div class="row"><b>'+esc(storeName(k))+'</b><span>'+bs[k]+' توصيلة</span></div></div>'});
  return h+'</div>';
}

// ===== الإجراءات =====
function rowOf(id){return ORDERS.filter(function(o){return o.id===id})[0]}
function patch(id,body,msg){
  return api("PATCH","orders?id=eq."+id,body,"return=representation").then(function(r){
    if(!r||!r.length){toast("لم يتم الحفظ (قد تكون الحالة تغيّرت). حدّثي الصفحة.",true);return loadOrders().then(function(){lastSig=sig();render()})}
    var o=rowOf(id);if(o)Object.keys(r[0]).forEach(function(k){o[k]=r[0][k]});
    lastSig=sig();toast(msg||"تم الحفظ ✓");render();
  }).catch(function(e){
    var m=String((e&&e.message)||"");
    if(/تسلسل|غير مسموح|سائقًا|السائق غير/.test(m))toast(m,true);else fail(e);
    loadOrders().then(function(){lastSig=sig();render()}).catch(function(){});
  });
}
var ACT={
  login:doLogin,logout:logout,
  reload:function(){location.reload()},
  mute:function(){muted=!muted;try{localStorage.setItem("sr_dv_mute",muted?"1":"0")}catch(e){}$("muteBtn").textContent=muted?"🔕":"🔔";if(!muted)beep()},
  assign:function(d){
    var id=d.id,drv=$("dr-"+id).value,kg=$("kg-"+id).value,un=$("un-"+id).value,fee=numv($("fee-"+id).value),note=$("nt-"+id).value.trim();
    var o=rowOf(id);
    if(!drv){toast("اختاري سائقًا أولًا",true);return}
    if(!(fee>0)){toast("حدّدي رسم التوصيل (أكبر من صفر)",true);return}
    var body={driver_id:drv,delivery_fee:fee,delivery_note:note,delivery_weight_kg:kg===""?null:Math.round(numv(kg)*(un==="g"?1:1000))/1000};
    patch(id,body,o&&o.delivery_status==="requested"?"عُيّن السائق ✓":"تم الحفظ ✓");
  },
  setst:function(d){
    var v=d.v;
    if(v==="cancelled"&&!confirm("إلغاء التوصيل لهذا الطلب؟"))return;
    if(v==="delivered"&&!confirm("تأكيد أن الطلب وصل للزبون؟"))return;
    patch(d.id,{delivery_status:v},v==="delivered"?"تم تسجيل التسليم ✓":v==="picked"?"تم تسجيل الاستلام ✓":"أُلغي التوصيل");
  },
  dpToggle:function(){
    var to=!DPAUSE;
    if(!confirm(to?"إيقاف توصيل الإسراء والمعراج؟ لن يستطيع الزبائن اختياره.":"تشغيل التوصيل الآن؟ سيستطيع الزبائن اختياره."))return;
    api("PATCH","app_settings?key=eq.delivery_paused",{value:to?"1":"0"},"return=representation").then(function(r){
      if(!r||!r.length){toast("لم يتم الحفظ",true);return}
      DPAUSE=to;toast(to?"تم الإيقاف المؤقت ✓":"تم تشغيل التوصيل ✓");render();
    }).catch(pErr);
  },
  dpSaveMsg:function(){
    var m=$("dpMsg").value.trim();if(m.length<3){toast("اكتبي رسالة واضحة",true);return}
    api("PATCH","app_settings?key=eq.delivery_paused_msg",{value:m},"return=representation").then(function(r){
      if(!r||!r.length){toast("لم يتم الحفظ",true);return}
      DPMSG=m;toast("تم حفظ الرسالة ✓");render();
    }).catch(pErr);
  },
  zoneAdd:function(){
    var n=$("znNew").value.trim(),f=numv($("zfNew").value);
    if(n.length<1){toast("اكتبي اسم الحي",true);return}
    if(!(f>0)){toast("اكتبي الرسم (أكبر من صفر)",true);return}
    api("POST","delivery_zones",{name:n,fee:f,sort_order:(ZONES.length?Math.max.apply(null,ZONES.map(function(z){return +z.sort_order||0}))+1:1)},"return=minimal").then(function(){toast("أُضيف الحي ✓");return reloadPrices()}).catch(pErr);
  },
  zoneSave:function(d){
    var n=$("zn-"+d.id).value.trim(),f=numv($("zf-"+d.id).value);
    if(!n||!(f>0)){toast("الاسم والرسم مطلوبان",true);return}
    api("PATCH","delivery_zones?id=eq."+d.id,{name:n,fee:f},"return=minimal").then(function(){toast("تم الحفظ ✓");return reloadPrices()}).catch(pErr);
  },
  zoneToggle:function(d){
    var z=ZONES.filter(function(x){return x.id===d.id})[0];if(!z)return;
    api("PATCH","delivery_zones?id=eq."+d.id,{active:!z.active},"return=minimal").then(function(){return reloadPrices()}).catch(pErr);
  },
  zoneDel:function(d){
    if(!confirm("حذف هذا الحي نهائيًا؟ (الطلبات السابقة تحتفظ باسمه)"))return;
    api("DELETE","delivery_zones?id=eq."+d.id).then(function(){toast("حُذف ✓");return reloadPrices()}).catch(pErr);
  },
  tierAdd:function(){
    var k=numv($("tkNew").value),e=numv($("teNew").value);
    if(!(k>0)||!(e>0)){toast("اكتبي الوزن والمبلغ (أكبر من صفر)",true);return}
    api("POST","delivery_weight_tiers",{over_kg:k,extra:e},"return=minimal").then(function(){toast("أُضيف ✓");return reloadPrices()}).catch(pErr);
  },
  tierSave:function(d){
    var k=numv($("tk-"+d.id).value),e=numv($("te-"+d.id).value);
    if(!(k>0)||!(e>0)){toast("اكتبي الوزن والمبلغ",true);return}
    api("PATCH","delivery_weight_tiers?id=eq."+d.id,{over_kg:k,extra:e},"return=minimal").then(function(){toast("تم الحفظ ✓");return reloadPrices()}).catch(pErr);
  },
  tierDel:function(d){
    if(!confirm("حذف هذا الحدّ؟"))return;
    api("DELETE","delivery_weight_tiers?id=eq."+d.id).then(function(){toast("حُذف ✓");return reloadPrices()}).catch(pErr);
  },
  addStaff:function(){
    var name=$("stName").value.trim(),ph=$("stPhone").value.trim(),pw=$("stPw").value,role=$("stRole").value;
    if(name.length<2){toast("اكتبي الاسم",true);return}
    if(waNum(ph).length<12){toast("رقم الهاتف غير صحيح",true);return}
    if(pw.length<8){toast("كلمة السر 8 أحرف على الأقل",true);return}
    adminFn({action:"create_staff",login:ph,password:pw,role:role,name:name,phone:ph}).then(function(j){
      toast(j.created?"تم إنشاء الحساب ✓":"الحساب موجود وتم تحديث دوره ✓");
      return api("GET","delivery_staff?select=*&order=created_at").then(function(x){STAFF=x||[];render()});
    }).catch(function(e){toast(String(e.message||e),true)});
  },
  toggleStaff:function(d){
    adminFn({action:"set_staff_active",user_id:d.id,active:d.v==="1"}).then(function(){
      STAFF.forEach(function(s){if(s.user_id===d.id)s.active=d.v==="1"});render();
    }).catch(function(e){toast(String(e.message||e),true)});
  },
  resetPw:function(d){
    var ph=d.login;if(!ph){toast("لا يوجد رقم هاتف مسجّل لهذا الموظف",true);return}
    var pw=prompt("كلمة السر الجديدة (8 أحرف على الأقل):");if(!pw)return;
    adminFn({action:"set_password",login:ph,password:pw}).then(function(){toast("تم تغيير كلمة السر ✓")}).catch(function(e){toast(String(e.message||e),true)});
  }
};
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.tab){TAB=d.tab;render();return}
  if(d.filt){FILT=d.filt;render();return}
  if(d.act&&ACT[d.act])ACT[d.act](d);
});
function wtRecalc(id){
  var o=rowOf(id),kgEl=$("kg-"+id),unEl=$("un-"+id),feeEl=$("fee-"+id);if(!o||!kgEl||!feeEl)return;
  var z=zoneByName(o.delivery_zone),raw=numv(kgEl.value);if(!z||kgEl.value==="")return;
  var kg=unEl&&unEl.value==="g"?raw/1000:raw,ex=extraFor(kg);
  feeEl.value=(+z.fee)+ex;
  var h=$("fh-"+id);if(h)h.textContent="رسم "+o.delivery_zone+" "+fmt(z.fee)+(ex?" + زيادة وزن "+fmt(ex):"")+" = "+fmt((+z.fee)+ex)+" جنيه (يمكنك تعديله)";
}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("numonly")){var v=t.value.replace(/[^\d.]/g,"").replace(/(\..*)\./g,"$1");if(v!==t.value)t.value=v}
  if(t.dataset&&t.dataset.wt)wtRecalc(t.dataset.wt);
});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.wt&&t.tagName==="SELECT")wtRecalc(t.dataset.wt)});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="lgPass")doLogin()});

// ===== التشغيل =====
loadSess();
if(SESS)boot();else showLogin();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){var w=reg.installing;if(w)w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)$("updBar").hidden=false})});
  }).catch(function(){});
}
</script>
