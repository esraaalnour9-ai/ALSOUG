<style>
:root{--bg:#f2f6f5;--card:#fff;--text:#10262a;--muted:#5f7478;--line:#e2ebea;--soft:#eef4f3;--amber:#0e8a86;--amber2:#14b8a6;--amberd:#0a6b68;--amberbg:#e6f5f3;--gold:#f2b134;--ink:#0b3536;--green:#16a34a;--red:#e11d48;--sh:0 1px 2px rgba(11,53,54,.06),0 8px 24px -12px rgba(11,53,54,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#081517;--card:#0f2427;--text:#eaf5f4;--muted:#8fb0b0;--line:#1c3a3d;--soft:#152e31;--amberbg:#123638;--amber:#19b3ad;--amberd:#5eead4;--ink:#04191b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:88px;line-height:1.6}
header{background:var(--ink);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-weight:800;font-size:16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#f59e0b);display:grid;place-items:center;color:var(--ink);font-weight:900;font-size:17px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:15px;margin:0 0 12px;font-weight:800}
.muted{color:var(--muted);font-size:12.5px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);font:inherit;font-size:14px;margin-bottom:10px}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(20,184,166,.25)}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
button{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
.btn{background:var(--amber);color:#fff}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-red{background:#fff1f2;color:var(--red)}.btn-green{background:#e8f8ee;color:var(--green)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px}
.install-banner{background:var(--amberbg);border:1px solid var(--amber);border-radius:16px;padding:12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.install-banner p{margin:0;font-size:13px;font-weight:700}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}
.iname{font-weight:800;font-size:14px}.imeta{color:var(--muted);font-size:12px;margin-top:2px}
.off{color:var(--red);font-weight:800}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:13px}
.err{background:#fff1f2;color:var(--red);padding:12px 14px;border-radius:14px;font-size:13px;margin-bottom:12px}
.ok{background:#e8f8ee;color:var(--green);padding:12px 14px;border-radius:14px;font-size:13px;margin-bottom:12px}
.linkbox{display:flex;gap:6px;align-items:center;background:var(--amberbg);border:1px dashed var(--amber);border-radius:12px;padding:8px 10px;font-size:11.5px;overflow:hidden;margin-top:8px}
.linkbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;direction:ltr;text-align:left}
.thumb{width:48px;height:48px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.thumb img,.pv img{width:100%;height:100%;object-fit:cover}
.hint{font-size:11.5px;color:var(--muted);margin:-4px 0 10px;line-height:1.7}
.pv{width:64px;height:64px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;margin-bottom:8px}
.pwaModalWrap{position:fixed;inset:0;background:rgba(4,25,27,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.pwaModalWrap[hidden]{display:none}
.pwaModal{background:var(--card);border-radius:22px;padding:22px 18px;max-width:360px;width:100%;position:relative;font-size:13.5px;line-height:1.8}
.pwaModal ol{padding-inline-start:20px;margin:8px 0}.pwaModal li{margin-bottom:4px}
.pwaX{position:absolute;top:10px;left:10px;background:var(--soft);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
/* ترحيب */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:4px 2px}
.hello .av{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--amber2),var(--amberd));color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex-shrink:0}
.hello b{display:block;font-size:16px}.hello span{color:var(--muted);font-size:12.5px}
.welcome{background:linear-gradient(140deg,var(--ink) 0%,#0e5f5c 100%);color:#fff;border:0;position:relative;overflow:hidden}
.welcome:after{content:"";position:absolute;left:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(242,177,52,.35),transparent 70%)}
.welcome h2{color:#fff;position:relative}.welcome .muted{color:#b8d9d6;position:relative}
.welcome-emoji{font-size:28px;margin-bottom:4px;position:relative}
.qstats{display:flex;gap:8px;margin-top:12px;position:relative}
.qcard{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;color:#fff;font-family:inherit}
.qcard .qn{font-size:22px;font-weight:900;color:var(--gold)}.qcard .ql{font-size:11px;color:#c9e4e1;margin-top:2px;font-weight:700}
.headBtns{display:flex;gap:8px;align-items:center}
.bell,.muteBtn{position:relative;background:rgba(255,255,255,.12);border:0;border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;padding:0}
.bellbadge{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.bnav{position:fixed;bottom:10px;right:12px;left:12px;max-width:616px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px -8px rgba(11,53,54,.35);display:flex;z-index:8;padding:6px;margin-bottom:env(safe-area-inset-bottom,0)}
.navbtn{flex:1;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--muted);font-size:10.5px;font-weight:700}
.navbtn.active{color:var(--amberd);background:var(--amberbg)}
.navicon{position:relative;display:flex}.navicon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbadge{position:absolute;top:-6px;left:-9px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
#updBar{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:12px;left:12px;max-width:616px;margin:0 auto;z-index:9;background:var(--gold);color:#10262a;border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:13px;box-shadow:0 10px 28px -8px rgba(0,0,0,.35)}
#updBar[hidden]{display:none}#updBar button{background:var(--ink);color:#fff;padding:7px 14px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="brand"><div class="logo">ر</div><span id="hTitle">إدارة المتجر</span></div>
  <div class="headBtns">
    <button id="muteBtn" class="muteBtn" onclick="toggleMute()" title="كتم/تفعيل صوت الإشعارات">🔔</button>

<div id="updBar" hidden><span>✨ يوجد تحديث جديد للوحة</span><button onclick="applyUpdate()">تحديث الآن</button></div>

<nav id="bottomNav" class="bnav"></nav>

<div id="pwaModal" class="pwaModalWrap" hidden><div class="pwaModal"><button class="pwaX" onclick="closeInstallModal()">×</button><div id="pwaModalBody"></div></div></div>
<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbzXuDV6EXrtKxXGMte66aDQCnD-IF1BjL0fGtpEJTYtwNGf70ivpQCOHmYSaWkkFeJ6/exec";
var $=function(id){return document.getElementById(id)};
var qs=new URLSearchParams(location.search);
var KEY=qs.get("key")||"";
var STORE=qs.get("store")||"";
var MASTER_MODE=!STORE;
var data={},keysMap={},msg="",searchQuery="";
var stats=null;
var deferredPrompt=null;
var TAB="home";
var editingId=null;
var recentOrders=null; // تُملأ لاحقاً عبر getOrders، منفصلة عن stats
var orderStatuses={}; // order_key ("محل||orderId") -> "pending"/"done"، من ورقة OrderStatus المنفصلة
var ordersLimit=MASTER_MODE?15:10; // يزيد بزر "تحميل المزيد"

// ---- تفضيلات الإشعارات (لكل محل/الإدارة الرئيسية) ----
var NOTIF_KEY="notif_"+(STORE||"master");
var notif={lastSeenTs:0,muted:false};
var lastKnownMaxTs=0;
var audioCtx=null;

function imgUrl(u){
  u=String(u||"").trim();
  if(!/^https?:\/\//i.test(u))return "";
  if(/^https?:\/\/(pin\.it|(www\.)?google\.[a-z.]+\/search)/i.test(u))return "";
  var m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/);
  if(m)return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w200";
  return u;
}
function thumbHtml(u,cls){
  var s=imgUrl(u);
  return '<div class="'+(cls||"thumb")+'">'+(s?'<img src="'+esc(s)+'" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.textContent=\'📦\'">':'📦')+'</div>';
}
function previewImg(pfx){
  var box=$(pfx+"Pv");if(!box)return;
  box.outerHTML=thumbHtml($(pfx+"Img").value,"pv").replace('class="pv"','class="pv" id="'+pfx+'Pv"');
}
function normProduct(p){
  var o={};
  Object.keys(p||{}).forEach(function(k){o[String(k).trim().toLowerCase()]=p[k]});
  if(o.category==null||o.category==="")o.category=o["فئة"]||"";
  if(o.status==null||o.status==="")o.status=o["حالة"]||"موجود";
  if(!o.price_quarter)o.price_quarter=o["price_ quarter"]||o.price_quart||"";
  return o;
}

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function isInAppBrowser(){return /FBAN|FBAV|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent||"")}
function isStandaloneApp(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function installDismissed(){try{return sessionStorage.getItem("admin_noInstall")==="1"}catch(e){return false}}
function dismissInstall(){try{sessionStorage.setItem("admin_noInstall","1")}catch(e){}var c=$("installCard");if(c)c.remove()}
function showInstallModal(html){$("pwaModalBody").innerHTML=html;$("pwaModal").hidden=false}
function closeInstallModal(){$("pwaModal").hidden=true}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
});

function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){deferredPrompt=null;var c=$("installCard");if(c)c.remove()});
    return;
  }
  if(isInAppBrowser()){
    showInstallModal('<b>افتح الرابط من متصفح حقيقي أولاً</b>'+
      '<p>التثبيت غير ممكن داخل متصفح واتساب/انستقرام الداخلي. انسخ الرابط والصقه في Chrome أو Safari مباشرة.</p>'+
      '<button class="btn btn-sm" onclick="copy(location.href,this)">📋 نسخ رابط الصفحة</button>');
  }else if(isIOS()){
    showInstallModal('<b>لتثبيت التطبيق على آيفون/آيباد:</b>'+
      '<ol><li>اضغط زر المشاركة <b>⬆️</b> بالأسفل في Safari.</li>'+
      '<li>مرّر لتحت واختر <b>"إضافة إلى الشاشة الرئيسية"</b>.</li>'+
      '<li>اضغط <b>"إضافة"</b> أعلى الشاشة.</li></ol>'+
      '<div class="muted">يعمل فقط من متصفح Safari — لن يظهر الخيار من متصفح كروم على آيفون.</div>');
  }else{
    showInstallModal('<b>لتثبيت التطبيق:</b>'+
      '<ol><li>اضغط قائمة المتصفح <b>⋮</b> أعلى الشاشة.</li>'+
      '<li>اختر <b>"تثبيت التطبيق"</b> أو <b>"إضافة إلى الشاشة الرئيسية"</b>.</li></ol>');
  }
}

function post(action,payload){
  var body=Object.assign({action:action,key:KEY,store:STORE},payload||{});
  return fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function copy(text,btn){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){btn.textContent="✓ تم النسخ";setTimeout(function(){btn.textContent="📋 نسخ الرابط"},1400)})}
}

// ================= إشعارات صوتية + عداد =================
function loadNotif(){
  try{var raw=localStorage.getItem(NOTIF_KEY);if(raw)notif=Object.assign(notif,JSON.parse(raw));}catch(e){}
}
function saveNotif(){
  try{localStorage.setItem(NOTIF_KEY,JSON.stringify(notif));}catch(e){}
}
function orderTs(o){return new Date(o&&o.ts).getTime()||0}
function maxTs(orders){var m=0;(orders||[]).forEach(function(o){var t=orderTs(o);if(t>m)m=t});return m}
function unseenCount(){
  if(!recentOrders)return 0;
  return recentOrders.filter(function(o){return orderTs(o)>notif.lastSeenTs}).length;
}
function unlockAudio(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
document.addEventListener("click",unlockAudio,{once:true});
document.addEventListener("touchstart",unlockAudio,{once:true});
// نغمة تنبيه أقوى: نغمتان متبادلتان (شبيهة بـ"دينج-دونج") بدل تكرار نفس النغمة،
// مع صوت أعلى ومدة أطول ليصعب تفويته، بالإضافة إلى اهتزاز الجهاز إن كان مدعوماً.
function playBeep(){
  if(notif.muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    var pattern=[988,784,988]; // مي-صول-مي تقريباً: نغمة تنبيه مألوفة وواضحة
    pattern.forEach(function(freq,idx){
      var delay=idx*260;
      setTimeout(function(){
        var o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type="sine";o.frequency.value=freq;
        g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.65,audioCtx.currentTime+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.28);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+0.3);
      },delay);
    });
  }catch(e){}
  // اهتزاز الجهاز (أندرويد فقط — آيفون لا يدعم هذه الخاصية في المتصفح إطلاقاً)
  try{if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);}catch(e){}
  flashTitle();
}
// وميض عنوان تبويب المتصفح إذا كانت الصفحة في الخلفية، حتى ينتبه صاحب المحل
// حتى لو كان متصفحه مفتوحاً على تبويب آخر.
var origTitle=document.title,titleFlashTimer=null;
function flashTitle(){
  if(!document.hidden||titleFlashTimer)return;
  var on=false;
  titleFlashTimer=setInterval(function(){
    document.title=on?origTitle:"🔴 طلب جديد!";on=!on;
  },900);
}
function stopTitleFlash(){
  if(titleFlashTimer){clearInterval(titleFlashTimer);titleFlashTimer=null;document.title=origTitle;}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)stopTitleFlash()});
window.addEventListener("focus",stopTitleFlash);
function toggleMute(){
  notif.muted=!notif.muted;saveNotif();updateBellUI();
}
function updateBellUI(){
  var mb=$("muteBtn");if(mb)mb.textContent=notif.muted?"🔕":"🔔";
  var uc=unseenCount();
  var bb=$("bellBadge");
  if(bb){if(uc>0){bb.hidden=false;bb.textContent=uc>99?"99+":uc}else{bb.hidden=true}}
  var nb=$("navBadge_orders");
  if(nb){if(uc>0){nb.hidden=false;nb.textContent=uc>99?"99+":uc}else{nb.hidden=true}}
}
function markOrdersSeen(){
  notif.lastSeenTs=Math.max(notif.lastSeenTs,maxTs(recentOrders));
  saveNotif();updateBellUI();stopTitleFlash();
}
function pollOrders(){
  Promise.all([post("getOrders",{limit:ordersLimit}),fetchOrderStatuses()]).then(function(res){
    var ro=res[0];
    if(!ro||!ro.ok)return;
    var newMax=maxTs(ro.orders);
    recentOrders=ro.orders; // نحدّث دائماً (حتى لو ما فيه طلب جديد) حتى تنعكس تغييرات الحالة من جهاز آخر
    if(newMax>lastKnownMaxTs){
      lastKnownMaxTs=newMax;
      playBeep();
      updateBellUI();
    }
    if(TAB==="home"||TAB==="orders")renderCurrent();
  }).catch(function(){});
}
function onOrdersLoaded(ro){
  if(!ro||!ro.ok)return;
  recentOrders=ro.orders;
  var newMax=maxTs(ro.orders);
  if(newMax>lastKnownMaxTs)lastKnownMaxTs=newMax;
  if(!notif.lastSeenTs){notif.lastSeenTs=lastKnownMaxTs;saveNotif();} // أول تحميل: لا صوت لطلبات قديمة
  updateBellUI();
  renderCurrent();
}

// ================= تبويبات سفلية =================
var NAVSVG={home:"<path d='M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z'/>",orders:"<path d='M6 3h12v18l-3-2-3 2-3-2-3 2z'/><path d='M9 8h6M9 12h6'/>",analytics:"<path d='M4 20V10M10 20V4M16 20v-7M22 20H2'/>",stores:"<path d='M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9c0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0'/>",products:"<path d='M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8'/>",offers:"<path d='M3 12V4h8l10 10-8 8z'/><circle cx='7.5' cy='8.5' r='1'/>",settings:"<circle cx='12' cy='12' r='3'/><path d='M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2'/>"};
function buildNav(){
  var tabs=MASTER_MODE?[
    {id:"home",icon:"🏠",label:"الرئيسية"},
    {id:"orders",icon:"🧾",label:"الطلبات",badge:true},

function fmtTs(ts){
  try{
    var d=new Date(ts);
    return d.toLocaleString("ar-EG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  }catch(e){return ts}
}
function jsStr(s){return String(s==null?"":s).replace(/[^A-Za-z0-9 \u0600-\u06FF]/g,function(c){return "\\u"+("0000"+c.charCodeAt(0).toString(16)).slice(-4)})}
function dateHeaderLabel(ts){
  var d=new Date(ts),now=new Date();
  var y=new Date(now);y.setDate(y.getDate()-1);
  if(d.toDateString()===now.toDateString())return "اليوم";
  if(d.toDateString()===y.toDateString())return "أمس";
  return d.toLocaleDateString("ar-EG",{weekday:"long",day:"2-digit",month:"2-digit"});
}

  var k=store+"||"+orderId,prev=orderStatuses[k]||"pending";
  orderStatuses[k]=newStatus;renderCurrent(); // تحديث فوري بالواجهة قبل رد الخادم

    if(!r||!r.ok){orderStatuses[k]=prev;renderCurrent();alert((r&&r.error)||"فشل تحديث الحالة")}
  }).catch(function(){orderStatuses[k]=prev;renderCurrent();alert("تعذّر الاتصال بالخادم")});

  if(!confirm("حذف هذا الطلب نهائيًا من السجل؟ لا يمكن التراجع."))return;

      html+='<div class="item"><div class="row"><div class="row" style="justify-content:flex-start;min-width:0">'+thumbHtml(p.image)+'<div><div class="iname">'+esc(p.name)+'</div>'+
        '<div class="imeta">'+esc(p.category||"")+' • '+esc(p.unit||"")+' • '+(Number(p.price_full)||0).toLocaleString()+' ج.س'+
        (/نفد|غير متوفر/.test(String(p.status))?' • <span class="off">نفد</span>':'')+'</div>'+
        (noId?'<div class="imeta off">لا يوجد Id لهذا الصنف في الشيت (العمود A) — أضف له رقمًا من الشيت أول</div>':'')+'</div></div>'+
        (noId?'':'<div class="grp"><button class="btn-line btn-sm" onclick="editingId=\''+jsStr(pId)+'\';renderStore()">✏️ تعديل</button>'+
        '<button class="btn-red btn-sm" onclick="delProduct(\''+jsStr(pId)+'\')">🗑️ حذف</button></div>')+'</div></div>';
    }
  });
  return html;
}
function storeWelcomeHtml(){
  var st=data[STORE],products=(st&&st.products)||[];
  return '<div class="card"><h2>⚡ نظرة سريعة</h2>'+
    '<div class="qstats">'+
      qCard('🧾',stats?stats.weekCount:'…','طلبات الأسبوع','orders')+
      qCard('🛍️',products.length,'صنف متاح','products')+
      qCard('📊',stats?stats.monthCount:'…','طلبات الشهر','analytics')+
    '</div></div>';
}
function renderStore(){
  var st=data[STORE],products=st.products||[];
  var html=msg;msg="";
  if(TAB!=="home")html+=hello();
  if(TAB==="home"){
    html+=getInstallBannerHtml();
    html+=storeWelcomeHtml();
    html+=ordersListHtml((recentOrders||[]).slice(0,5),{showStore:false});
  }else if(TAB==="orders"){
    html+=ordersListHtml(recentOrders,{showStore:false,showLoadMore:true});
  }else if(TAB==="offers"){
    html+=offersTabHtml();
  }else if(TAB==="analytics"){
    html+=storeStatsHtml();
  }else if(TAB==="products"){
    html+='<div class="card"><h2>➕ إضافة صنف جديد</h2>'+productForm("n")+
      '<button class="btn" onclick="addProduct()">إضافة الصنف</button></div>';
    html+='<div class="card"><h2>البحث والأصناف ('+products.length+')</h2>'+
      '<label>🔍 ابحث عن صنف أو تصنيف</label>'+
      '<input id="searchBox" placeholder="اكتب اسم الصنف للبحث عنه..." value="'+esc(searchQuery)+'" oninput="handleSearch(this.value)">'+
      '<div id="plist">'+listHtml()+'</div></div>';
  }else if(TAB==="settings"){
    html+='<div class="card"><h2>بيانات التواصل</h2>'+
      '<label>اسم صاحب المحل (يظهر في رسالة الترحيب)</label><input id="mOwner" value="'+esc(st.ownerName||"")+'">'+
      '<label>رابط صورة المحل — اختياري</label><div class="pv" id="mPv">'+logoInner(st.logo)+'</div>'+
      '<input id="mLogo" value="'+esc(st.logo||"")+'" placeholder="https://...jpg" style="direction:ltr;text-align:left" oninput="previewLogo()">'+
      '<div class="hint">ضع رابطًا مباشرًا للصورة يبدأ بـ https (أو رابط مشاركة من قوقل درايف). إن تركته فارغًا يظهر رمز 🏪 للزبائن.</div>'+
      '<label>رقم واتساب</label><input id="mWa" value="'+esc(st.whatsapp||"")+'">'+
      '<label>رقم الحساب البنكي</label><input id="mBank" value="'+esc(st.bankAccount||"")+'">'+
      '<button class="btn btn-sm" onclick="saveMeta()">حفظ</button></div>';
  }
  $("app").innerHTML=html;
  updateNavActive();updateBellUI();
}

// البحث يحدّث قائمة الأصناف فقط، فلا يمسح ما كتبته في نموذج "إضافة صنف"
function handleSearch(val){
  searchQuery=val;
  var box=$("plist");
  if(box) box.innerHTML=listHtml();
}

function productForm(pfx,p){
  p=p||{};
  return '<label>الاسم</label><input id="'+pfx+'Name" value="'+esc(p.name)+'">'+
  '<label>التصنيف</label><input id="'+pfx+'Cat" value="'+esc(p.category)+'">'+
  '<label>الوحدة</label><input id="'+pfx+'Unit" value="'+esc(p.unit)+'">'+
  '<label>السعر (كامل)</label><input id="'+pfx+'PF" type="number" value="'+esc(p.price_full)+'">'+
  '<label>السعر (نصف) — اختياري</label><input id="'+pfx+'PH" type="number" value="'+esc(p.price_half)+'">'+
  '<label>السعر (ربع) — اختياري</label><input id="'+pfx+'PQ" type="number" value="'+esc(p.price_quarter)+'">'+
  '<label>الحالة</label><select id="'+pfx+'St"><option value="موجود"'+(p.status!=="نفد"?" selected":"")+'>موجود</option><option value="نفد"'+(p.status==="نفد"?" selected":"")+'>نفد</option></select>'+
  '<label>رابط صورة — اختياري</label>'+
  thumbHtml(p.image,"pv").replace('class="pv"','class="pv" id="'+pfx+'Pv"')+
  '<input id="'+pfx+'Img" value="'+esc(p.image)+'" placeholder="https://...jpg" oninput="previewImg(\''+pfx+'\')">'+
  '<div class="hint">ضع رابطًا مباشرًا للصورة (ينتهي غالبًا بـ jpg أو png) أو رابط مشاركة من قوقل درايف. لو تركته فاضي يظهر رمز التصنيف بدل الصورة.</div>';
}

function readForm(pfx){
  return{
    name: $(pfx+"Name") ? $(pfx+"Name").value.trim() : "",
    category: $(pfx+"Cat") ? $(pfx+"Cat").value.trim() : "",
    unit: $(pfx+"Unit") ? $(pfx+"Unit").value.trim() : "",
    price_full: $(pfx+"PF") && $(pfx+"PF").value ? Number($(pfx+"PF").value) : 0,
    price_half: $(pfx+"PH") && $(pfx+"PH").value ? Number($(pfx+"PH").value) : "",
    price_quarter: $(pfx+"PQ") && $(pfx+"PQ").value ? Number($(pfx+"PQ").value) : "",
    status: $(pfx+"St") ? $(pfx+"St").value : "موجود",
    image: $(pfx+"Img") ? $(pfx+"Img").value.trim() : ""
  };
}

function saveMeta(){
  post("updateMeta",{logo:$("mLogo").value.trim(),ownerName:$("mOwner").value.trim(),whatsapp:$("mWa").value.trim(),bankAccount:$("mBank").value.trim()}).then(function(r){
    flash(r.ok?"تم الحفظ ✓":(r.error||"فشل الحفظ"),!!r.ok);load();
  });
}
function addProduct(){
  var p=readForm("n");
  if(!p.name){alert("اكتب اسم الصنف");return}
  post("addProduct",{product:p}).then(function(r){flash(r.ok?"تمت الإضافة ✓":(r.error||"فشل"),!!r.ok);load()});
}
function saveEdit(id){
  var p=readForm("e");
  post("updateProduct",{id:id,product:p}).then(function(r){
    editingId=null;
    flash(r.ok?"تم حفظ التعديل ✓":(r.error||"فشل التعديل"),!!r.ok);
    load();
  });
}
function delProduct(id){
  if(!confirm("حذف هذا الصنف نهائياً؟"))return;
  post("deleteProduct",{id:id}).then(function(r){flash(r.ok?"تم الحذف ✓":(r.error||"فشل"),!!r.ok);load()});
}

// ===== تحديث تلقائي: يقارن رقم الإصدار (meta app-version) مع النسخة الموجودة على الخادم =====
function myVersion(){var m=document.querySelector('meta[name="app-version"]');return m?m.content:""}
function checkUpdate(){
  fetch(location.pathname,{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/name="app-version" content="([^"]+)"/);
    if(m&&m[1]!==myVersion()){var b=$("updBar");if(b)b.hidden=false}
  }).catch(function(){});
}
function applyUpdate(){
  fetch(location.pathname,{cache:"reload"}).catch(function(){}).then(function(){location.reload()});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,3000);setInterval(checkUpdate,300000);

loadNotif();
buildNav();
updateBellUI();
load();
setInterval(pollOrders,25000);
</script>
</body>
</html>
