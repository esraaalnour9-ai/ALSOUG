function compressImage(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");

// الدخول برقم الهاتف: يُحوَّل الرقم إلى بريد داخلي ثابت (لا يُرسَل له شيء)
function loginId(v){
  v=String(v||"").trim();
  if(v.indexOf("@")>-1)return v.toLowerCase();
  var d=v.replace(/\D/g,"");
  if(d.length<9)return v;
  if(d.indexOf("249")===0&&d.length===12){}
  else if(d.charAt(0)==="0"&&d.length===10)d="249"+d.slice(1);
  else if(d.length===9)d="249"+d;
  return d+"@phone.rahad.app";
}
function doLogin(){
  var em=loginId($("lgEmail").value),pw=$("lgPass").value;
  if(!em||!pw){toast("أدخل رقم الهاتف أو البريد وكلمة السر",true);return}
  authCall("token?grant_type=password",{email:em,password:pw}).then(function(r){
    if(!r.ok||!r.j.access_token){var ec=(r.j&&(r.j.error_code||r.j.msg||r.j.error))||"";toast(ec==="invalid_credentials"||!ec?"رقم الهاتف/البريد أو كلمة السر غير صحيحة":"تعذّر الدخول: "+ec,true);return}
    setSessFrom(r.j);boot();
  }).catch(fail);
}

function beep(){
  if(notif.muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    [988,784,988].forEach(function(f,i){setTimeout(function(){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.6,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);
    },i*260)});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}

// ===== الرئيسية =====
function homeHtml(){
  var hr=new Date().getHours(),g=hr>=5&&hr<12?"صباح الخير":"مساء الخير";
  var who=ME.master?"مدير سوق الرهد":(CUR?CUR.name:"");
  var all=ME.master&&ALLV;
  var data=STATS.filter(function(o){return all||!CUR||o.store_id===CUR.id});
  var now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var t7=d0-6*864e5,tM=new Date(now.getFullYear(),now.getMonth(),1).getTime(),t30=d0-29*864e5;
  function tot(from){var n=0,s=0;data.forEach(function(o){if(+new Date(o.created_at)>=from){n++;s+=Number(o.total||0)}});return{n:n,s:s}}
  var pd=tot(d0),pw=tot(t7),pm=tot(tM);
  var pend=data.filter(function(o){return o.status==="pending"}).length;
  // الأكثر طلبًا + الأصناف التي بيعت (آخر 30 يومًا)
  var agg={},soldIds={};
  data.forEach(function(o){
    if(+new Date(o.created_at)<t30)return;
    (o.order_items||[]).forEach(function(i){
      var k=(all?o.store_id:"")+"|"+i.name;
      var r=agg[k]||(agg[k]={name:i.name,store:all?o.store_id:"",qty:0,sum:0});
      r.qty+=Number(i.qty||0);r.sum+=Number(i.price||0)*Number(i.qty||0);
      if(i.product_id)soldIds[i.product_id]=1;
    });
  });
  var top=Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){return b.qty-a.qty}).slice(0,5);
  var h=storeSwitch()+'<div class="card welcome"><div class="welcome-emoji">👋</div><h2>'+g+'، '+esc(who)+'</h2><div class="muted">'+(all?'هذه لمحة سريعة عن السوق كله.':'هذه لمحة سريعة عن متجرك.')+'</div>'+
    '<div class="qstats"><button class="qcard" data-tab="orders"><div class="qn">'+pend+'</div><div class="ql">طلبات جديدة</div></button>'+
    '<button class="qcard" data-tab="'+(all?'admin':'products')+'"><div class="qn">'+(all?STORES.length:PRODUCTS.length)+'</div><div class="ql">'+(all?'متاجر':'أصناف')+'</div></button>'+
    '<button class="qcard" data-tab="orders"><div class="qn">'+fmt(pd.s)+'</div><div class="ql">مبيعات اليوم</div></button></div></div>';
  // المبيعات حسب الفترة
  function tile(t,p){return '<div style="flex:1;min-width:0;background:var(--bg,#f3f6f5);border-radius:12px;padding:10px;text-align:center"><div class="muted" style="font-size:12px">'+t+'</div><div style="font-weight:800;font-size:17px;margin:4px 0">'+fmt(p.s)+'</div><div class="muted" style="font-size:12px">'+p.n+' طلب</div></div>'}
  h+='<div class="card"><h2>📊 المبيعات</h2><div style="display:flex;gap:8px">'+tile("اليوم",pd)+tile("آخر 7 أيام",pw)+tile("هذا الشهر",pm)+'</div></div>';
  // الأكثر طلبًا
  h+='<div class="card"><h2>🔥 الأكثر طلبًا (آخر 30 يومًا)</h2>';
  if(!top.length)h+='<div class="empty">لا توجد مبيعات بعد.</div>';
  top.forEach(function(r,i){var st=r.store?storeById(r.store):null;h+='<div class="item"><div class="row"><div class="iname">'+(i+1)+'. '+esc(r.name)+(st?' <span class="muted" style="font-size:12px">— '+esc(st.name)+'</span>':'')+'</div><b>×'+r.qty+'</b></div><div class="imeta">إجمالي '+fmt(r.sum)+' جنيه</div></div>'});
  h+='</div>';
  if(all){
    // ترتيب المتاجر بمبيعات الشهر
    var bs={};data.forEach(function(o){if(+new Date(o.created_at)>=tM){var r=bs[o.store_id]||(bs[o.store_id]={n:0,s:0});r.n++;r.s+=Number(o.total||0)}});
    var rank=Object.keys(bs).map(function(k){return{id:k,n:bs[k].n,s:bs[k].s}}).sort(function(a,b){return b.s-a.s}).slice(0,8);
    h+='<div class="card"><h2>🏬 المتاجر الأكثر مبيعًا هذا الشهر</h2>';
    if(!rank.length)h+='<div class="empty">لا توجد مبيعات هذا الشهر.</div>';
    rank.forEach(function(r,i){var st=storeById(r.id);h+='<div class="item"><div class="row"><div class="iname">'+(i+1)+'. '+esc(st?st.name:"—")+'</div><b>'+fmt(r.s)+'</b></div><div class="imeta">'+r.n+' طلب</div></div>'});
    h+='</div>';
  }else if(CUR){
    // أصناف متوفرة لم تُبع
    var unsold=PRODUCTS.filter(function(p){return p.status==="موجود"&&!soldIds[p.id]});
    h+='<div class="card"><h2>🐢 أصناف متوفرة لم تُبع (آخر 30 يومًا)</h2>';
    if(!PRODUCTS.length)h+='<div class="empty">لا توجد أصناف بعد.</div>';
    else if(!unsold.length)h+='<div class="empty">كل أصنافك المتوفرة بيعت 👏</div>';
    else{h+='<div class="hint" style="margin:0 0 8px">'+unsold.length+' من '+PRODUCTS.length+' صنفًا لم يطلبه أحد. فكّري في عرض أو تخفيض سعر لها.</div>';
      unsold.slice(0,10).forEach(function(p){h+='<div class="item"><div class="row"><div class="iname">'+esc(p.name)+'</div><span class="muted">'+esc(p.category||"")+'</span></div></div>'});
      if(unsold.length>10)h+='<div class="muted" style="text-align:center">و'+(unsold.length-10)+' صنفًا آخر</div>'}
    h+='</div>';
  }
  if(!ORDERS.length)h+='<div class="card"><div class="hint" style="margin:0">لا توجد طلبات بعد. ستظهر هنا فور وصولها.</div></div>';
  return h;
}

function saveProduct(){
  var name=$("pName").value.trim();if(!name){toast("أدخل اسم الصنف",true);return}
  var full=num($("pFull").value);if(!(full>0)){toast("أدخل السعر",true);return}
  var row={name:name,category:$("pCat").value.trim(),unit:$("pUnit").value.trim(),price_full:full,
    price_half:$("pHalf")?num($("pHalf").value):0,price_quarter:$("pQuarter")?num($("pQuarter").value):0,
    status:$("pStatus").value,image_url:$("pImg").value.trim()};
  if($("pMin"))row.min_amount=num($("pMin").value);
  var p=editingId?api("PATCH","products?id=eq."+editingId,row,"return=representation"):api("POST","products",Object.assign({store_id:CUR.id},row),"return=representation");
  p.then(function(r){
    var x=r&&r[0];if(x){if(editingId)PRODUCTS=PRODUCTS.map(function(o){return o.id===x.id?x:o});else PRODUCTS.unshift(x)}
    editingId=null;toast("تم الحفظ ✓");render();
  }).catch(fail);
}

  renameStore:function(d){var s=storeById(d.id);var n=prompt("الاسم الجديد للمتجر:",s.name);if(!n||!n.trim()||n.trim()===s.name)return;api("PATCH","stores?id=eq."+d.id,{name:n.trim()},"return=representation").then(function(r){if(r&&r[0])Object.assign(s,r[0]);toast("تم التغيير ✓");render()}).catch(fail)},
  delStore:function(d){var s=storeById(d.id);if(!s)return;
    if(!confirm("حذف متجر «"+s.name+"» نهائيًا مع أصنافه وعروضه وآرائه وحجوزاته؟ لا يمكن التراجع."))return;
    if(!confirm("تأكيد أخير: حذف «"+s.name+"»؟"))return;
    api("DELETE","stores?id=eq."+d.id,null,"return=representation").then(function(r){
      if(!r||!r.length){toast("لم يُحذف المتجر. جرّبي الإخفاء بدل الحذف",true);return}
      STORES=STORES.filter(function(x){return x.id!==d.id});
      if(CUR&&CUR.id===d.id)CUR=STORES[0]||null;
      buildNav();toast("تم حذف المتجر");render()
    }).catch(function(e){toast("لا يمكن حذف متجر عليه طلبات سابقة. استخدمي الإخفاء",true)})},
  toggleStore:function(d){var s=storeById(d.id);api("PATCH","stores?id=eq."+d.id,{active:!s.active},"return=minimal").then(function(){s.active=!s.active;render()}).catch(fail)},
  addProv:function(){var n=$("pvName").value.trim();if(!n){toast("اكتب اسم الوسيلة",true);return}api("POST","payment_providers",{name:n,sort_order:PROVIDERS.length+1},"return=representation").then(function(r){if(r&&r[0])PROVIDERS.push(r[0]);toast("تمت الإضافة ✓");render()}).catch(fail)},
  renameProv:function(d){
    var p=PROVIDERS.filter(function(x){return x.id===d.id})[0];var n=prompt("الاسم الجديد للوسيلة:",p.name);if(!n||!n.trim()||n.trim()===p.name)return;
    var old=p.name;n=n.trim();
    api("PATCH","payment_providers?id=eq."+d.id,{name:n},"return=minimal")
    .then(function(){return api("PATCH","store_payment_accounts?provider=eq."+encodeURIComponent(old),{provider:n},"return=minimal")})
    .then(function(){p.name=n;ACCTS.forEach(function(a){if(a.provider===old)a.provider=n});toast("تم التغيير ✓");render()}).catch(fail);
  },
  toggleProv:function(d){var p=PROVIDERS.filter(function(x){return x.id===d.id})[0];api("PATCH","payment_providers?id=eq."+d.id,{active:!p.active},"return=minimal").then(function(){p.active=!p.active;render()}).catch(fail)}
};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){setTab(t.dataset.tab);return}
  var f=ACT[t.dataset.act];if(f)f(t.dataset);
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.dept&&t.value==="__new"){var nn=(prompt("اسم القسم الجديد:")||"").trim().slice(0,60);
    if(nn){var o=document.createElement("option");o.textContent=nn;t.insertBefore(o,t.lastChild);t.value=nn}else t.value="";return}
  if(t&&t.dataset&&t.dataset.upl&&t.files&&t.files[0]){uploadImage(t.files[0],t.dataset.upl,t.dataset.pv);return}
  if(e.target.id==="storeSel"){
    if(e.target.value==="__all"){ALLV=true;editingId=null;buildNav();render();return}
    ALLV=false;CUR=storeById(e.target.value);try{localStorage.setItem("sr_adm_store",CUR.id)}catch(x){}editingId=null;buildNav();loadStoreData().then(buildNav)}
});
document.addEventListener("input",function(e){if(e.target.id==="searchBox"){searchQ=e.target.value;render()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="lgPass")doLogin()});

// ===== تحديث نسخة الصفحة =====
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){var w=reg.installing;if(w)w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)$("updBar").hidden=false})});
  }).catch(function(){});
}
loadSess();
if(SESS)boot();else showLogin();
</script>
