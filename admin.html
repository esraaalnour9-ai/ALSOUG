      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error("تعذّر معالجة الصورة"))},"image/jpeg",q);
    };

    im.src=url;

// الدخول برقم الهاتف: يُحوَّل الرقم إلى بريد داخلي ثابت (لا يُرسَل له شيء)
function loginId(v){
  v=String(v||"").trim();
  if(v.indexOf("@")>-1)return v.toLowerCase();
  var d=v.replace(/\D/g,"");
  if(d.length<9)return v;
  if(d.indexOf("249")===0&&d.length===12){}
  else if(d.charAt(0)==="0"&&d.length===10)d="249"+d.slice(1);
  else if(d.length===9)d="249"+d;
  return d+"@phone.rahad.app";
}
function doLogin(){
  var em=loginId($("lgEmail").value),pw=$("lgPass").value;
  if(!em||!pw){toast("أدخل رقم الهاتف أو البريد وكلمة السر",true);return}
  authCall("token?grant_type=password",{email:em,password:pw}).then(function(r){
    if(!r.ok||!r.j.access_token){var ec=(r.j&&(r.j.error_code||r.j.msg||r.j.error))||"";toast(ec==="invalid_credentials"||!ec?"رقم الهاتف/البريد أو كلمة السر غير صحيحة":"تعذّر الدخول: "+ec,true);return}
    setSessFrom(r.j);boot();
  }).catch(fail);
}
function logout(){
  var tok=SESS&&SESS.access;SESS=null;saveSess();
  if(tok)fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+tok}}).catch(function(){});
  showLogin();
}

  .then(function(r){
    ME.master=!!(r[0]&&r[0].length);
    var ids=(r[1]||[]).map(function(x){return x.store_id});
    STORES=ME.master?r[2]:r[2].filter(function(s){return ids.indexOf(s.id)>-1});
    PROVIDERS=r[3]||[];
    if(!STORES.length&&!ME.master){
      $("app").innerHTML='<div class="card"><div class="err">حسابك غير مرتبط بأي متجر بعد. تواصل مع إدارة سوق الرهد.</div><button class="btn btn-line" data-act="logout">تسجيل الخروج</button></div>';
      $("outBtn").hidden=false;return;
    }

function loadStoreData(){
  var sid=CUR&&CUR.id;

  if(sid){
    jobs.push(api("GET","products?select=*&store_id=eq."+sid+"&order=created_at.desc&limit=2000").then(function(x){PRODUCTS=x||[]}));
    jobs.push(api("GET","offers?select=*&or=(store_id.eq."+sid+(ME.master?",store_id.is.null":"")+")&order=created_at.desc&limit=200").then(function(x){OFFERS=x||[]}));
    jobs.push(api("GET","store_payment_accounts?select=*&store_id=eq."+sid+"&order=sort_order,created_at").then(function(x){ACCTS=x||[]}));
  }else{PRODUCTS=[];OFFERS=[];ACCTS=[]}

function loadStats(){
  var since=new Date(Date.now()-35*864e5).toISOString();

function loadOrders(){
  return api("GET","orders?select=id,code,store_id,customer_name,customer_phone,customer_address,pay_method,total,status,created_at,order_items(name,unit,qty,price)&order=created_at.desc&limit="+ordersLimit)
  .then(function(x){

    if(!notif.lastSeen){notif.lastSeen=mx;saveNotif()}

function unseen(){return ORDERS.filter(function(o){return +new Date(o.created_at)>notif.lastSeen}).length}
function badge(){
  var n=unseen(),b=$("navBadge_orders");
  if(b){b.hidden=!n;b.textContent=n>99?"99+":n}
  $("muteBtn").textContent=notif.muted?"🔕":"🔔";
}
function beep(){
  if(notif.muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    [988,784,988].forEach(function(f,i){setTimeout(function(){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.6,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);
    },i*260)});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
document.addEventListener("click",function(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}},{once:true});

function homeHtml(){
  var hr=new Date().getHours(),g=hr>=5&&hr<12?"صباح الخير":"مساء الخير";
  var who=ME.master?"مدير سوق الرهد":(CUR?CUR.name:"");
  var all=ME.master&&ALLV;
  var data=STATS.filter(function(o){return all||!CUR||o.store_id===CUR.id});
  var now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var t7=d0-6*864e5,tM=new Date(now.getFullYear(),now.getMonth(),1).getTime(),t30=d0-29*864e5;
  function tot(from){var n=0,s=0;data.forEach(function(o){if(+new Date(o.created_at)>=from){n++;s+=Number(o.total||0)}});return{n:n,s:s}}
  var pd=tot(d0),pw=tot(t7),pm=tot(tM);

  h+='</div>';

function saveProduct(){
  var name=$("pName").value.trim();if(!name){toast("أدخل اسم الصنف",true);return}
  var full=num($("pFull").value);if(!(full>0)){toast("أدخل السعر",true);return}
  var row={name:name,category:$("pCat").value.trim(),unit:$("pUnit").value.trim(),price_full:full,
    price_half:$("pHalf")?num($("pHalf").value):0,price_quarter:$("pQuarter")?num($("pQuarter").value):0,
    status:$("pStatus").value,image_url:$("pImg").value.trim()};
  if($("pMin"))row.min_amount=num($("pMin").value);
  var mq=Math.floor(num($("pMinQty").value))||1;
  if(mq>1||(editingId&&PRODUCTS.some(function(o){return o.id===editingId&&o.min_qty>1})))row.min_qty=Math.max(1,mq);
  var p=editingId?api("PATCH","products?id=eq."+editingId,row,"return=representation"):api("POST","products",Object.assign({store_id:CUR.id},row),"return=representation");
  p.then(function(r){
    var x=r&&r[0];if(x){if(editingId)PRODUCTS=PRODUCTS.map(function(o){return o.id===x.id?x:o});else PRODUCTS.unshift(x)}
    editingId=null;toast("تم الحفظ ✓");render();
  }).catch(fail);
}

var ACT={
  pickCam:function(d){var el=$("cam_"+d.i);if(el){el.value="";el.click()}},
  pickGal:function(d){var el=$("gal_"+d.i);if(el){el.value="";el.click()}},
  clearImg:function(d){$(d.i).value="";var pv=$(d.p);if(pv)pv.textContent=d.ph},
  changeMyPw:function(){
    var p1=$("myPw1").value,p2=$("myPw2").value;
    if(p1.length<8){toast("كلمة المرور 8 أحرف على الأقل",true);return}
    if(p1!==p2){toast("الكلمتان غير متطابقتين",true);return}
    ready().then(function(){
      return fetch(SB_URL+"/auth/v1/user",{method:"PUT",headers:{apikey:SB_KEY,Authorization:"Bearer "+SESS.access,"Content-Type":"application/json"},body:JSON.stringify({password:p1})});
    }).then(function(r){return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var m=String(j.msg||j.message||j.error_description||"");throw new Error(/same|different/i.test(m)?"اختر كلمة مختلفة عن الحالية":(/weak|short|least/i.test(m)?"كلمة المرور ضعيفة، اجعلها أطول":(m||"تعذّر التغيير، سجّل الدخول من جديد وحاول")))}
      $("myPw1").value="";$("myPw2").value="";
      // نجدّد الجلسة بكلمة المرور الجديدة حتى لا تنتهي الجلسة القديمة
      var em=SESS&&SESS.email;
      if(em)return authCall("token?grant_type=password",{email:em,password:p1}).then(function(r2){
        if(r2.ok&&r2.j.access_token){setSessFrom(r2.j);toast("تم تغيير كلمة المرور ✓")}
        else{SESS=null;saveSess();showLogin("تم تغيير كلمة المرور ✓ سجّلي الدخول بالكلمة الجديدة.")}
      });
      toast("تم تغيير كلمة المرور ✓");
    })}).catch(fail);
  },
  createMerchant:function(){
    var ph=$("maPhone").value.trim(),pw=$("maPass").value;
    if(!ph){toast("أدخل رقم هاتف التاجر",true);return}

    var st=storeById($("maStore").value);

      $("maPhone").value="";$("maPass").value="";

    }).catch(fail);
  },
  resetMerchantPw:function(){
    var ph=$("rpPhone").value.trim(),pw=$("rpPass").value;
    if(!ph){toast("أدخل رقم هاتف التاجر",true);return}

  addProv:function(){var n=$("pvName").value.trim();if(!n){toast("اكتب اسم الوسيلة",true);return}api("POST","payment_providers",{name:n,sort_order:PROVIDERS.length+1},"return=representation").then(function(r){if(r&&r[0])PROVIDERS.push(r[0]);toast("تمت الإضافة ✓");render()}).catch(fail)},

    var p=PROVIDERS.filter(function(x){return x.id===d.id})[0];var n=prompt("الاسم الجديد للوسيلة:",p.name);if(!n||!n.trim()||n.trim()===p.name)return;
    var old=p.name;n=n.trim();
    api("PATCH","payment_providers?id=eq."+d.id,{name:n},"return=minimal")
    .then(function(){return api("PATCH","store_payment_accounts?provider=eq."+encodeURIComponent(old),{provider:n},"return=minimal")})
    .then(function(){p.name=n;ACCTS.forEach(function(a){if(a.provider===old)a.provider=n});toast("تم التغيير ✓");render()}).catch(fail);
  },
  toggleProv:function(d){var p=PROVIDERS.filter(function(x){return x.id===d.id})[0];api("PATCH","payment_providers?id=eq."+d.id,{active:!p.active},"return=minimal").then(function(){p.active=!p.active;render()}).catch(fail)}
};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){setTab(t.dataset.tab);return}
  var f=ACT[t.dataset.act];if(f)f(t.dataset);
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.upl&&t.files&&t.files[0]){uploadImage(t.files[0],t.dataset.upl,t.dataset.pv);return}
  if(e.target.id==="storeSel"){
    if(e.target.value==="__all"){ALLV=true;editingId=null;render();return}
    ALLV=false;CUR=storeById(e.target.value);try{localStorage.setItem("sr_adm_store",CUR.id)}catch(x){}editingId=null;loadStoreData()}
});
document.addEventListener("input",function(e){if(e.target.id==="searchBox"){searchQ=e.target.value;render()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="lgPass")doLogin()});

// ===== تحديث نسخة الصفحة =====
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){var w=reg.installing;if(w)w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)$("updBar").hidden=false})});
  }).catch(function(){});
}
loadSess();
if(SESS)boot();else showLogin();
</script>
