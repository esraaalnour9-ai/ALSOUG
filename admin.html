<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المتجر - سوق الرهد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e7ebf1;--soft:#f1f4f9;--amber:#f59e0b;--amber2:#fbbf24;--amberd:#d97706;--amberbg:#fff7e8;--green:#16a34a;--red:#e11d48}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--text:#f1f5f9;--muted:#94a3b8;--line:#243049;--soft:#1b2740;--amberbg:#2a2110}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:var(--bg);color:var(--text);padding-bottom:82px}
header{background:linear-gradient(120deg,var(--amber2),var(--amberd));color:#111;padding:16px 14px;font-weight:900;font-size:16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:14px;margin:0 0 10px}
.muted{color:var(--muted);font-size:12.5px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--text);font-size:13.5px;margin-bottom:8px}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
button{border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer}
.btn{background:var(--amber);color:#111}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-red{background:#fef2f2;color:var(--red)}
.btn-green{background:#ecfdf3;color:var(--green)}
.btn-sm{padding:6px 10px;font-size:11.5px}
.install-banner{background:var(--amberbg);border:1px solid var(--amber);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.install-banner p{margin:0;font-size:13px;font-weight:700;color:var(--text)}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.iname{font-weight:800;font-size:13.5px}
.imeta{color:var(--muted);font-size:12px;margin-top:2px}
.off{color:var(--red);font-weight:800}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:13px}
.err{background:#fef2f2;color:var(--red);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
.ok{background:#ecfdf3;color:var(--green);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
.linkbox{display:flex;gap:6px;align-items:center;background:var(--amberbg);border:1px dashed var(--amber);border-radius:9px;padding:8px 10px;font-size:11.5px;overflow:hidden;margin-top:6px}
.linkbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.thumb{width:44px;height:44px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.hint{font-size:11.5px;color:var(--muted);margin:-4px 0 8px;line-height:1.6}
.pv{width:64px;height:64px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;margin-bottom:8px}
.pv img{width:100%;height:100%;object-fit:cover}

.pwaModalWrap{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.pwaModalWrap[hidden]{display:none}
.pwaModal{background:var(--card);border-radius:16px;padding:20px 18px;max-width:360px;width:100%;position:relative;font-size:13.5px;line-height:1.8}
.pwaModal ol{padding-inline-start:20px;margin:8px 0}
.pwaModal li{margin-bottom:4px}
.pwaX{position:absolute;top:10px;left:10px;background:var(--soft);width:28px;height:28px;border-radius:50%;font-size:16px;border:0;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--text)}

/* ===== إضافات: ترحيب + بطاقات إحصائية + تبويبات سفلية + إشعارات ===== */
.welcome{background:linear-gradient(120deg,var(--amberbg),var(--card));border-color:var(--amber)}
.welcome-emoji{font-size:30px;margin-bottom:4px}
.qstats{display:flex;gap:8px;margin-top:10px}
.qcard{flex:1;background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center;border:0;cursor:pointer;color:var(--text);font-family:inherit}
.qcard .qn{font-size:17px;font-weight:900;color:var(--amberd)}
.qcard .ql{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:700}

.headBtns{display:flex;gap:6px;align-items:center}
.bell,.muteBtn{position:relative;background:rgba(255,255,255,.4);border:0;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#111;padding:0}
.bellbadge{position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}

.bnav{position:fixed;bottom:0;right:0;left:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:8;padding-bottom:env(safe-area-inset-bottom,0)}
.navbtn{flex:1;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit}
.navbtn.active{color:var(--amberd)}
.navicon{position:relative;font-size:19px;line-height:1}
.navbadge{position:absolute;top:-6px;left:-9px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
</style>
</head>
<body>
<header>
  <span id="hTitle">إدارة المتجر</span>
  <div class="headBtns">
    <button id="muteBtn" class="muteBtn" onclick="toggleMute()" title="كتم/تفعيل صوت الإشعارات">🔔</button>
    <button class="bell" onclick="setTab('orders')" title="الطلبات"><span>🧾</span><span id="bellBadge" class="bellbadge" hidden>0</span></button>
  </div>
</header>
<main id="app"><div class="empty">⏳ جاري التحميل...</div></main>
<nav id="bottomNav" class="bnav"></nav>

<div id="pwaModal" class="pwaModalWrap" hidden><div class="pwaModal"><button class="pwaX" onclick="closeInstallModal()">×</button><div id="pwaModalBody"></div></div></div>
<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbzXuDV6EXrtKxXGMte66aDQCnD-IF1BjL0fGtpEJTYtwNGf70ivpQCOHmYSaWkkFeJ6/exec";
var $=function(id){return document.getElementById(id)};
var qs=new URLSearchParams(location.search);
var KEY=qs.get("key")||"";
var STORE=qs.get("store")||"";
var MASTER_MODE=!STORE;
var data={},keysMap={},msg="",searchQuery="";
var stats=null;
var deferredPrompt=null;
var TAB="home";
var editingId=null;
var recentOrders=null; // تُملأ لاحقاً عبر getOrders، منفصلة عن stats

// ---- تفضيلات الإشعارات (لكل محل/الإدارة الرئيسية) ----
var NOTIF_KEY="notif_"+(STORE||"master");
var notif={lastSeenTs:0,muted:false};
var lastKnownMaxTs=0;
var audioCtx=null;

function imgUrl(u){
  u=String(u||"").trim();
  if(!/^https?:\/\//i.test(u))return "";
  if(/^https?:\/\/(pin\.it|(www\.)?google\.[a-z.]+\/search)/i.test(u))return "";
  var m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/);
  if(m)return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w200";
  return u;
}
function thumbHtml(u,cls){
  var s=imgUrl(u);
  return '<div class="'+(cls||"thumb")+'">'+(s?'<img src="'+esc(s)+'" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.textContent=\'📦\'">':'📦')+'</div>';
}
function previewImg(pfx){
  var box=$(pfx+"Pv");if(!box)return;
  box.outerHTML=thumbHtml($(pfx+"Img").value,"pv").replace('class="pv"','class="pv" id="'+pfx+'Pv"');
}
function normProduct(p){
  var o={};
  Object.keys(p||{}).forEach(function(k){o[String(k).trim().toLowerCase()]=p[k]});
  if(o.category==null||o.category==="")o.category=o["فئة"]||"";
  if(o.status==null||o.status==="")o.status=o["حالة"]||"موجود";
  if(!o.price_quarter)o.price_quarter=o["price_ quarter"]||o.price_quart||"";
  return o;
}

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function isInAppBrowser(){return /FBAN|FBAV|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent||"")}
function isStandaloneApp(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function installDismissed(){try{return sessionStorage.getItem("admin_noInstall")==="1"}catch(e){return false}}
function dismissInstall(){try{sessionStorage.setItem("admin_noInstall","1")}catch(e){}var c=$("installCard");if(c)c.remove()}
function showInstallModal(html){$("pwaModalBody").innerHTML=html;$("pwaModal").hidden=false}
function closeInstallModal(){$("pwaModal").hidden=true}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
});

function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){deferredPrompt=null;var c=$("installCard");if(c)c.remove()});
    return;
  }
  if(isInAppBrowser()){
    showInstallModal('<b>افتح الرابط من متصفح حقيقي أولاً</b>'+
      '<p>التثبيت غير ممكن داخل متصفح واتساب/انستقرام الداخلي. انسخ الرابط والصقه في Chrome أو Safari مباشرة.</p>'+
      '<button class="btn btn-sm" onclick="copy(location.href,this)">📋 نسخ رابط الصفحة</button>');
  }else if(isIOS()){
    showInstallModal('<b>لتثبيت التطبيق على آيفون/آيباد:</b>'+
      '<ol><li>اضغط زر المشاركة <b>⬆️</b> بالأسفل في Safari.</li>'+
      '<li>مرّر لتحت واختر <b>"إضافة إلى الشاشة الرئيسية"</b>.</li>'+
      '<li>اضغط <b>"إضافة"</b> أعلى الشاشة.</li></ol>'+
      '<div class="muted">يعمل فقط من متصفح Safari — لن يظهر الخيار من متصفح كروم على آيفون.</div>');
  }else{
    showInstallModal('<b>لتثبيت التطبيق:</b>'+
      '<ol><li>اضغط قائمة المتصفح <b>⋮</b> أعلى الشاشة.</li>'+
      '<li>اختر <b>"تثبيت التطبيق"</b> أو <b>"إضافة إلى الشاشة الرئيسية"</b>.</li></ol>');
  }
}

function post(action,payload){
  var body=Object.assign({action:action,key:KEY,store:STORE},payload||{});
  return fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function copy(text,btn){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){btn.textContent="✓ تم النسخ";setTimeout(function(){btn.textContent="📋 نسخ الرابط"},1400)})}
}

// ================= إشعارات صوتية + عداد =================
function loadNotif(){
  try{var raw=localStorage.getItem(NOTIF_KEY);if(raw)notif=Object.assign(notif,JSON.parse(raw));}catch(e){}
}
function saveNotif(){
  try{localStorage.setItem(NOTIF_KEY,JSON.stringify(notif));}catch(e){}
}
function orderTs(o){return new Date(o&&o.ts).getTime()||0}
function maxTs(orders){var m=0;(orders||[]).forEach(function(o){var t=orderTs(o);if(t>m)m=t});return m}
function unseenCount(){
  if(!recentOrders)return 0;
  return recentOrders.filter(function(o){return orderTs(o)>notif.lastSeenTs}).length;
}
function unlockAudio(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
document.addEventListener("click",unlockAudio,{once:true});
document.addEventListener("touchstart",unlockAudio,{once:true});
function playBeep(){
  if(notif.muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    [0,190].forEach(function(delay){
      setTimeout(function(){
        var o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type="sine";o.frequency.value=880;
        g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.28,audioCtx.currentTime+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.22);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+0.24);
      },delay);
    });
  }catch(e){}
}
function toggleMute(){
  notif.muted=!notif.muted;saveNotif();updateBellUI();
}
function updateBellUI(){
  var mb=$("muteBtn");if(mb)mb.textContent=notif.muted?"🔕":"🔔";
  var uc=unseenCount();
  var bb=$("bellBadge");
  if(bb){if(uc>0){bb.hidden=false;bb.textContent=uc>99?"99+":uc}else{bb.hidden=true}}
  var nb=$("navBadge_orders");
  if(nb){if(uc>0){nb.hidden=false;nb.textContent=uc>99?"99+":uc}else{nb.hidden=true}}
}
function markOrdersSeen(){
  notif.lastSeenTs=Math.max(notif.lastSeenTs,maxTs(recentOrders));
  saveNotif();updateBellUI();
}
function pollOrders(){
  var limit=MASTER_MODE?20:15;
  post("getOrders",{limit:limit}).then(function(ro){
    if(!ro||!ro.ok)return;
    var newMax=maxTs(ro.orders);
    if(newMax>lastKnownMaxTs){
      lastKnownMaxTs=newMax;
      recentOrders=ro.orders;
      playBeep();
      updateBellUI();
      if(TAB==="home"||TAB==="orders")renderCurrent();
    }
  }).catch(function(){});
}
function onOrdersLoaded(ro){
  if(!ro||!ro.ok)return;
  recentOrders=ro.orders;
  var newMax=maxTs(ro.orders);
  if(newMax>lastKnownMaxTs)lastKnownMaxTs=newMax;
  if(!notif.lastSeenTs){notif.lastSeenTs=lastKnownMaxTs;saveNotif();} // أول تحميل: لا صوت لطلبات قديمة
  updateBellUI();
  renderCurrent();
}

// ================= تبويبات سفلية =================
function buildNav(){
  var tabs=MASTER_MODE?[
    {id:"home",icon:"🏠",label:"الرئيسية"},
    {id:"orders",icon:"🧾",label:"الطلبات",badge:true},
    {id:"analytics",icon:"📊",label:"التحليلات"},
    {id:"stores",icon:"🏬",label:"المحلات"}
  ]:[
    {id:"home",icon:"🏠",label:"الرئيسية"},
    {id:"orders",icon:"🧾",label:"الطلبات",badge:true},
    {id:"analytics",icon:"📊",label:"التحليلات"},
    {id:"products",icon:"🛍️",label:"الأصناف"},
    {id:"settings",icon:"⚙️",label:"الإعدادات"}
  ];
  var html="";
  tabs.forEach(function(t){
    html+='<button class="navbtn" data-tab="'+t.id+'" onclick="setTab(\''+t.id+'\')"><span class="navicon">'+t.icon+
      (t.badge?'<span class="navbadge" id="navBadge_'+t.id+'" hidden>0</span>':'')+
      '</span><span class="navlabel">'+t.label+'</span></button>';
  });
  $("bottomNav").innerHTML=html;
}
function updateNavActive(){
  document.querySelectorAll(".navbtn").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===TAB)});
}
function setTab(t){
  TAB=t;
  if(t==="orders")markOrdersSeen();
  renderCurrent();
  window.scrollTo(0,0);
}
function renderCurrent(){if(MASTER_MODE)renderMaster();else renderStore();}

function load(){
  fetch(SCRIPT_URL).then(function(r){return r.json()}).then(function(d){
    data=d;
    Object.keys(data).forEach(function(s){data[s].products=(data[s].products||[]).map(normProduct)});
    if(!KEY){renderError("الرابط ناقص المفتاح — تأكد إنك فتحت الرابط كامل كما أُرسل لك.");return}
    if(MASTER_MODE){
      $("hTitle").textContent="لوحة الإدارة الرئيسية";
      post("listKeys").then(function(r){
        if(!r.ok){renderError("المفتاح غير صحيح — تأكد من الرابط.");return}
        keysMap=r.stores||{};renderMaster();
        post("getStats").then(function(rs){if(rs&&rs.ok){stats=rs;renderMaster()}});
        post("getOrders",{limit:15}).then(onOrdersLoaded);
      }).catch(function(){renderError("تعذّر الاتصال بالخادم (طلب المفاتيح).")});
    }else{
      $("hTitle").textContent="إدارة: "+STORE;
      if(!data[STORE]){renderError("المحل \""+STORE+"\" غير موجود.");return}
      renderStore();
      post("getStats").then(function(rs){if(rs&&rs.ok){stats=rs;renderStore()}});
      post("getOrders",{limit:10}).then(onOrdersLoaded);
    }
  }).catch(function(){renderError("تعذّر الاتصال بالخادم. تحقق من اتصالك بالإنترنت.")});
}

function renderError(m){
  $("app").innerHTML='<div class="err">⚠️ '+esc(m)+'</div>';
}
function flash(m,ok){msg='<div class="'+(ok?"ok":"err")+'">'+esc(m)+'</div>';}

function getInstallBannerHtml(){
  if(isStandaloneApp()||installDismissed())return "";
  return '<div class="install-banner" id="installCard">'+
    '<p>📲 ثبت تطبيق إدارة متجرك للوصول السريع</p>'+
    '<div class="grp"><button class="btn btn-sm" onclick="installApp()">تثبيت الآن</button>'+
    '<button class="btn-line btn-sm" onclick="dismissInstall()">لاحقًا</button></div>'+
  '</div>';
}
function qCard(icon,num,label,tab){
  return '<button class="qcard" onclick="setTab(\''+tab+'\')"><div>'+icon+'</div><div class="qn">'+num+'</div><div class="ql">'+esc(label)+'</div></button>';
}

function fmtTs(ts){
  try{
    var d=new Date(ts);
    return d.toLocaleString("ar-EG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  }catch(e){return ts}
}
function ordersListHtml(orders,opts){
  opts=opts||{};
  if(!orders)return '<div class="card"><h2>🧾 آخر الطلبات</h2><div class="empty">⏳ جاري التحميل...</div></div>';
  if(!orders.length)return '<div class="card"><h2>🧾 آخر الطلبات</h2><div class="empty">ما فيه طلبات مسجّلة بعد.</div></div>';
  var html='<div class="card"><h2>🧾 آخر الطلبات ('+orders.length+')</h2>';
  orders.forEach(function(o){
    html+='<div class="item"><div class="row"><b class="imeta">'+fmtTs(o.ts)+'</b>'+
      (opts.showStore?'<span class="off" style="color:var(--amberd);font-weight:800">'+esc(o.store)+'</span>':'')+
      '<b style="color:var(--amberd)">'+Number(o.total||0).toLocaleString()+' ج.س</b></div>'+
      '<div class="muted" style="margin-top:4px">'+
      o.items.map(function(it){return esc(it.name)+' ('+esc(it.unit)+') ×'+it.qty}).join('، ')+
      '</div></div>';
  });
  html+='</div>';
  return html;
}
function storeStatsHtml(){
  if(!stats||stats.scope!=="store")return "";
  var html='<div class="card"><h2>📈 إحصائياتك</h2>'+
    '<div class="row" style="margin-bottom:8px"><span>طلبات هذا الأسبوع</span><b style="font-size:20px">'+stats.weekCount+'</b></div>'+
    '<div class="row"><span>طلبات آخر 30 يوم</span><b>'+stats.monthCount+'</b></div>';
  if(stats.topProducts.length){
    html+='<div class="muted" style="margin:10px 0 6px">🔥 أكثر أصنافك طلبًا</div>';
    stats.topProducts.forEach(function(p,i){
      html+='<div class="item" style="padding:6px 0"><div class="row"><span>'+(i+1)+'. '+esc(p.name)+'</span><b>×'+p.qty+'</b></div></div>';
    });
  }
  html+='</div>';
  return html;
}

function marketStatsHtml(){
  if(!stats||stats.scope!=="market")return "";
  var html='<div class="card"><h2>📊 نظرة عامة على السوق (آخر 30 يوم)</h2>';
  if(!stats.topStores.length){
    html+='<div class="empty">ما فيه طلبات مسجّلة بعد.</div></div>';
    return html;
  }
  html+='<div class="muted" style="margin-bottom:6px">🏆 الأكثر طلبًا</div>';
  stats.topStores.forEach(function(s,i){
    html+='<div class="item" style="padding:6px 0"><div class="row"><span>'+(i+1)+'. '+esc(s.store)+'</span><b>'+s.count+' طلب</b></div></div>';
  });
  if(stats.topProducts.length){
    html+='<div class="muted" style="margin:10px 0 6px">🔥 الأكثر طلبًا (كل الأصناف)</div>';
    stats.topProducts.forEach(function(p,i){
      html+='<div class="item" style="padding:6px 0"><div class="row"><span>'+(i+1)+'. '+esc(p.name)+' <span class="muted">('+esc(p.store)+')</span></span><b>×'+p.qty+'</b></div></div>';
    });
  }
  html+='</div>';
  return html;
}

// ================= وضع الإدارة الرئيسية =================
function masterWelcomeHtml(storeCount){
  var monthTotal=0;
  if(stats&&stats.scope==="market"&&stats.topStores){stats.topStores.forEach(function(s){monthTotal+=s.count||0})}
  var totalProducts=0;Object.keys(data).forEach(function(n){totalProducts+=(data[n].products||[]).length});
  return '<div class="card welcome"><div class="welcome-emoji">🏆</div>'+
    '<h2 style="font-size:17px;margin:0 0 4px">أهلاً بك في لوحة تحكم سوق الرهد</h2>'+
    '<p class="muted" style="margin:0 0 12px">من هنا تتابع كل محلات السوق وطلباتها في مكان واحد، بكل سهولة.</p>'+
    '<div class="qstats">'+
      qCard('🏬',storeCount,'محل','stores')+
      qCard('🧾',stats&&stats.scope==="market"?monthTotal:'…','طلب هذا الشهر','analytics')+
      qCard('🛍️',totalProducts,'صنف','stores')+
    '</div></div>';
}
function renderMaster(){
  var names=Object.keys(data);
  var origin=location.origin+location.pathname.replace(/admin\.html$/,"");
  var html=msg;msg="";
  if(TAB==="home"){
    html+=getInstallBannerHtml();
    html+=masterWelcomeHtml(names.length);
    html+=ordersListHtml((recentOrders||[]).slice(0,5),{showStore:true});
  }else if(TAB==="orders"){
    html+=ordersListHtml(recentOrders,{showStore:true});
  }else if(TAB==="analytics"){
    html+=marketStatsHtml();
  }else if(TAB==="stores"){
    html+='<div class="card"><h2>➕ إضافة محل جديد</h2>'+
      '<label>اسم المحل (كما سيظهر للزبائن)</label><input id="nsName" placeholder="مثال: بقالة الأمل">'+
      '<label>رقم واتساب المحل (بدون +)</label><input id="nsWa" placeholder="2491xxxxxxxx">'+
      '<label>رقم الحساب البنكي (اختياري)</label><input id="nsBank">'+
      '<button class="btn" onclick="addStore()">إنشاء المحل</button></div>';
    html+='<div class="card"><h2>المحلات ('+names.length+')</h2>';
    if(!names.length)html+='<div class="empty">ما فيه محلات بعد.</div>';
    names.forEach(function(n){
      var storeKey=keysMap[n]||"";
      var link=origin+"admin.html?store="+encodeURIComponent(n)+"&key="+encodeURIComponent(storeKey);
      html+='<div class="item"><div class="row"><div><div class="iname">'+esc(n)+'</div><div class="imeta">'+((data[n].products||[]).length)+' صنف</div></div>'+
        '<div class="grp"><button class="btn-line btn-sm" onclick="goStore(\''+esc(n).replace(/'/g,"\\'")+'\')">✏️ فتح</button>'+
        '<button class="btn-red btn-sm" onclick="regen(\''+esc(n).replace(/'/g,"\\'")+'\')">🔄 رابط جديد</button></div></div>'+
        (storeKey?'<div class="linkbox"><span>'+esc(link)+'</span><button class="btn-sm btn-green" onclick=\'copy(this.previousElementSibling.textContent,this)\'>📋 نسخ الرابط</button></div>':'<div class="muted" style="margin-top:6px">لا يوجد مفتاح مسجّل لهذا المحل بعد.</div>')+
        '</div>';
    });
    html+='</div>';
  }
  $("app").innerHTML=html;
  updateNavActive();updateBellUI();
}
function goStore(n){location.href="admin.html?store="+encodeURIComponent(n)+"&key="+encodeURIComponent(KEY)}
function addStore(){
  var name=$("nsName").value.trim(),wa=$("nsWa").value.trim(),bank=$("nsBank").value.trim();
  if(!name){alert("اكتب اسم المحل");return}
  post("addStore",{name:name,whatsapp:wa,bankAccount:bank}).then(function(r){
    if(!r.ok){flash(r.error||"فشل الإنشاء",false);renderMaster();return}
    flash("تم إنشاء \""+name+"\" بنجاح ✓",true);
    load();
  });
}
function regen(n){
  if(!confirm('توليد رابط جديد ل"'+n+'"؟ الرابط القديم يتوقف عن العمل فورًا.'))return;
  post("regenKey",{store:n}).then(function(r){
    if(!r.ok){flash(r.error||"فشل التوليد",false);renderMaster();return}
    keysMap[n]=r.key;flash("تم توليد رابط جديد ل\""+n+"\" — انسخه وابعثه له",true);renderMaster();
  });
}

// ================= وضع إدارة محل واحد =================
function listHtml(){
  var products=(data[STORE]&&data[STORE].products)||[];
  var q=searchQuery.trim().toLowerCase();
  var filtered=products.filter(function(p){
    if(!q) return true;
    return String(p.name==null?"":p.name).toLowerCase().indexOf(q)>-1 ||
           String(p.category==null?"":p.category).toLowerCase().indexOf(q)>-1;
  });
  if(!filtered.length) return '<div class="empty">لا توجد أصناف مطابقة للبحث.</div>';
  var html="";
  filtered.forEach(function(p){
    var pId=String(p.id!=null?p.id:"").trim();
    if(editingId!==null && editingId===pId && pId){
      html+='<div class="item">'+productForm("e",p)+
        '<div class="grp"><button class="btn btn-sm" onclick="saveEdit(\''+esc(pId)+'\')">حفظ التعديل</button>'+
        '<button class="btn-line btn-sm" onclick="editingId=null;renderStore()">إلغاء</button></div></div>';
    }else{
      var noId=!pId;
      html+='<div class="item"><div class="row"><div class="row" style="justify-content:flex-start;min-width:0">'+thumbHtml(p.image)+'<div><div class="iname">'+esc(p.name)+'</div>'+
        '<div class="imeta">'+esc(p.category||"")+' • '+esc(p.unit||"")+' • '+(Number(p.price_full)||0).toLocaleString()+' ج.س'+
        (/نفد|غير متوفر/.test(String(p.status))?' • <span class="off">نفد</span>':'')+'</div>'+
        (noId?'<div class="imeta off">لا يوجد Id لهذا الصنف في الشيت (العمود A) — أضف له رقمًا من الشيت أول</div>':'')+'</div></div>'+
        (noId?'':'<div class="grp"><button class="btn-line btn-sm" onclick="editingId=\''+esc(pId)+'\';renderStore()">✏️ تعديل</button>'+
        '<button class="btn-red btn-sm" onclick="delProduct(\''+esc(pId)+'\')">🗑️ حذف</button></div>')+'</div></div>';
    }
  });
  return html;
}
function storeWelcomeHtml(){
  var st=data[STORE],products=(st&&st.products)||[];
  return '<div class="card welcome"><div class="welcome-emoji">🎉</div>'+
    '<h2 style="font-size:17px;margin:0 0 4px">أهلاً بك، '+esc(STORE)+'!</h2>'+
    '<p class="muted" style="margin:0 0 12px">متجرك الآن جزء من <b>سوق الرهد التجاري</b> — إدارة طلباتك وأصنافك بكل سهولة من هاتفك.</p>'+
    '<div class="qstats">'+
      qCard('🧾',stats?stats.weekCount:'…','طلبات الأسبوع','orders')+
      qCard('🛍️',products.length,'صنف متاح','products')+
      qCard('📊',stats?stats.monthCount:'…','طلبات الشهر','analytics')+
    '</div></div>';
}
function renderStore(){
  var st=data[STORE],products=st.products||[];
  var html=msg;msg="";
  if(TAB==="home"){
    html+=getInstallBannerHtml();
    html+=storeWelcomeHtml();
    html+=ordersListHtml((recentOrders||[]).slice(0,5),{showStore:false});
  }else if(TAB==="orders"){
    html+=ordersListHtml(recentOrders,{showStore:false});
  }else if(TAB==="analytics"){
    html+=storeStatsHtml();
  }else if(TAB==="products"){
    html+='<div class="card"><h2>➕ إضافة صنف جديد</h2>'+productForm("n")+
      '<button class="btn" onclick="addProduct()">إضافة الصنف</button></div>';
    html+='<div class="card"><h2>البحث والأصناف ('+products.length+')</h2>'+
      '<label>🔍 ابحث عن صنف أو تصنيف</label>'+
      '<input id="searchBox" placeholder="اكتب اسم الصنف للبحث عنه..." value="'+esc(searchQuery)+'" oninput="handleSearch(this.value)">'+
      '<div id="plist">'+listHtml()+'</div></div>';
  }else if(TAB==="settings"){
    html+='<div class="card"><h2>بيانات التواصل</h2>'+
      '<label>رقم واتساب</label><input id="mWa" value="'+esc(st.whatsapp||"")+'">'+
      '<label>رقم الحساب البنكي</label><input id="mBank" value="'+esc(st.bankAccount||"")+'">'+
      '<button class="btn btn-sm" onclick="saveMeta()">حفظ</button></div>';
  }
  $("app").innerHTML=html;
  updateNavActive();updateBellUI();
}

// البحث يحدّث قائمة الأصناف فقط، فلا يمسح ما كتبته في نموذج "إضافة صنف"
function handleSearch(val){
  searchQuery=val;
  var box=$("plist");
  if(box) box.innerHTML=listHtml();
}

function productForm(pfx,p){
  p=p||{};
  return '<label>الاسم</label><input id="'+pfx+'Name" value="'+esc(p.name)+'">'+
  '<label>التصنيف</label><input id="'+pfx+'Cat" value="'+esc(p.category)+'">'+
  '<label>الوحدة</label><input id="'+pfx+'Unit" value="'+esc(p.unit)+'">'+
  '<label>السعر (كامل)</label><input id="'+pfx+'PF" type="number" value="'+esc(p.price_full)+'">'+
  '<label>السعر (نصف) — اختياري</label><input id="'+pfx+'PH" type="number" value="'+esc(p.price_half)+'">'+
  '<label>السعر (ربع) — اختياري</label><input id="'+pfx+'PQ" type="number" value="'+esc(p.price_quarter)+'">'+
  '<label>الحالة</label><select id="'+pfx+'St"><option value="موجود"'+(p.status!=="نفد"?" selected":"")+'>موجود</option><option value="نفد"'+(p.status==="نفد"?" selected":"")+'>نفد</option></select>'+
  '<label>رابط صورة — اختياري</label>'+
  thumbHtml(p.image,"pv").replace('class="pv"','class="pv" id="'+pfx+'Pv"')+
  '<input id="'+pfx+'Img" value="'+esc(p.image)+'" placeholder="https://...jpg" oninput="previewImg(\''+pfx+'\')">'+
  '<div class="hint">ضع رابطًا مباشرًا للصورة (ينتهي غالبًا بـ jpg أو png) أو رابط مشاركة من قوقل درايف. لو تركته فاضي يظهر رمز التصنيف بدل الصورة.</div>';
}

function readForm(pfx){
  return{
    name: $(pfx+"Name") ? $(pfx+"Name").value.trim() : "",
    category: $(pfx+"Cat") ? $(pfx+"Cat").value.trim() : "",
    unit: $(pfx+"Unit") ? $(pfx+"Unit").value.trim() : "",
    price_full: $(pfx+"PF") && $(pfx+"PF").value ? Number($(pfx+"PF").value) : 0,
    price_half: $(pfx+"PH") && $(pfx+"PH").value ? Number($(pfx+"PH").value) : "",
    price_quarter: $(pfx+"PQ") && $(pfx+"PQ").value ? Number($(pfx+"PQ").value) : "",
    status: $(pfx+"St") ? $(pfx+"St").value : "موجود",
    image: $(pfx+"Img") ? $(pfx+"Img").value.trim() : ""
  };
}

function saveMeta(){
  post("updateMeta",{whatsapp:$("mWa").value.trim(),bankAccount:$("mBank").value.trim()}).then(function(r){
    flash(r.ok?"تم الحفظ ✓":(r.error||"فشل الحفظ"),!!r.ok);load();
  });
}
function addProduct(){
  var p=readForm("n");
  if(!p.name){alert("اكتب اسم الصنف");return}
  post("addProduct",{product:p}).then(function(r){flash(r.ok?"تمت الإضافة ✓":(r.error||"فشل"),!!r.ok);load()});
}
function saveEdit(id){
  var p=readForm("e");
  post("updateProduct",{id:id,product:p}).then(function(r){
    editingId=null;
    flash(r.ok?"تم حفظ التعديل ✓":(r.error||"فشل التعديل"),!!r.ok);
    load();
  });
}
function delProduct(id){
  if(!confirm("حذف هذا الصنف نهائياً؟"))return;
  post("deleteProduct",{id:id}).then(function(r){flash(r.ok?"تم الحذف ✓":(r.error||"فشل"),!!r.ok);load()});
}

loadNotif();
buildNav();
updateBellUI();
load();
setInterval(pollOrders,25000);
</script>
